<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소도 명심보감</title>
<meta name="theme-color" content="#2e1e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명심보감">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#f4ecd8; --paper2:#ebe0c4; --card:#fbf6ea; --ink:#2a1f18; --ink2:#5b4a3b; --muted:#8a7660;
  --red:#a8241f; --gold:#b5873f; --line:#d9c9a5; --head:#2e1e16;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif;line-height:1.7;min-height:100vh;
  background-image:radial-gradient(rgba(150,110,60,.06) 1px,transparent 1px);background-size:6px 6px}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#f4e6c8;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{flex:1;margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:none;border:0;width:42px;height:42px;border-radius:10px;font-size:1.35rem;color:#f4e6c8;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.12)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--head);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;color:#cdb998;padding:6px 0;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .i{font-size:1.3rem;line-height:1}
nav.tabs button.on{color:#ffe2a8}
.hero{text-align:center;padding:18px 8px 6px}
.hero .seal{display:inline-block;background:var(--red);color:#fbeee0;font-weight:700;padding:4px 7px;border-radius:4px;font-size:.9rem;letter-spacing:.1em;transform:rotate(-3deg)}
.hero h2{margin:8px 0 2px;font-size:1.75rem;letter-spacing:.12em}
.hero p{margin:0;color:var(--muted);font-size:.92rem}
.sec-title{margin:22px 4px 8px;font-size:1rem;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sec-title:before{content:"";width:4px;height:1.1em;background:var(--red);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin:10px 0;box-shadow:0 1px 3px rgba(80,50,20,.08)}
.today{border:2px solid var(--gold);background:linear-gradient(#fdf8ec,#f7eed8)}
.today .lbl{color:var(--red);font-weight:700;font-size:.85rem;margin-bottom:4px;display:flex;justify-content:space-between}
.h{font-size:calc(1.22rem * var(--fs));line-height:1.75;font-weight:700;word-break:keep-all;letter-spacing:.02em}
.r{font-size:calc(.92rem * var(--fs));color:var(--ink2);margin-top:6px;word-break:keep-all}
.k{font-size:calc(1.02rem * var(--fs));margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);word-break:keep-all}
.hide-r .r,.hide-h .h{display:none}
.study .k{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.study .k.show{filter:none}
.study .k:not(.show)::after{content:""}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:.8rem}
.meta a{color:var(--muted)}
.star{background:none;border:0;font-size:1.45rem;cursor:pointer;color:#c9b48d;padding:0 4px;line-height:1}
.star.on{color:#d18f12}
.chlist{display:grid;grid-template-columns:1fr;gap:8px}
.chbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.chbtn:active{background:var(--paper2)}
.chbtn .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--head);color:#f4e6c8;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.chbtn .tt{flex:1;min-width:0}
.chbtn .tt b{font-size:1.08rem}
.chbtn .tt span{color:var(--muted);font-size:.85rem;margin-left:6px}
.chbtn .tt small{display:block;color:var(--ink2);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbtn .cnt{color:var(--muted);font-size:.8rem}
.chhead{text-align:center;margin:8px 0 14px}
.chhead .hz{font-size:1.6rem;letter-spacing:.2em;font-weight:700}
.chhead .d{color:var(--ink2);font-size:.92rem}
.pager{display:flex;gap:8px;margin-top:18px}
.pager button{flex:1;background:var(--head);color:#f4e6c8;border:0;border-radius:12px;padding:12px;cursor:pointer;font-size:.92rem}
.pager button:disabled{opacity:.3}
.search{display:flex;gap:8px;margin:4px 0 12px}
.search input{flex:1;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fffdf6;color:var(--ink)}
mark{background:#f6d77e;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.opt .t b{display:block}
.opt .t small{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fffdf6;padding:8px 12px;cursor:pointer;font-size:.95rem}
.seg button.on{background:var(--head);color:#f4e6c8}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbb994;border-radius:30px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--red)}
.sw input:checked+span:before{transform:translateX(22px)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px;cursor:pointer;font-size:.98rem}
.quick button .i{display:block;font-size:1.5rem}
.note{color:var(--muted);font-size:.85rem;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.num{display:inline-block;min-width:1.8em;color:var(--red);font-weight:700}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="back" aria-label="뒤로" style="visibility:hidden">‹</button>
  <h1 id="ttl">소도 명심보감</h1>
  <button class="hbtn" id="rnd" aria-label="아무 구절">🎲</button>
</header>
<main id="app"></main>
<nav class="tabs">
  <button data-go="#/" ><span class="i">🏠</span>처음</button>
  <button data-go="#/toc"><span class="i">📖</span>목차</button>
  <button data-go="#/search"><span class="i">🔍</span>검색</button>
  <button data-go="#/fav"><span class="i">⭐</span>즐겨찾기</button>
  <button data-go="#/set"><span class="i">⚙️</span>설정</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const BOOK = [{"t": "계선편", "h": "繼善篇", "d": "하늘이 준 착한 마음을 이어 가라는 가르침", "items": [{"h": "子曰 爲善者는 天報之以福하고 爲不善者는 天報之以禍니라", "r": "자왈 위선자는 천보지이복하고 위불선자는 천보지이화니라", "k": "공자께서 말씀하셨다. \"착한 일을 하는 사람에게는 하늘이 복으로 갚아 주고, 착하지 않은 일을 하는 사람에게는 하늘이 재앙으로 갚는다.\""}, {"h": "漢昭烈이 將終에 勅後主曰 勿以善小而不爲하고 勿以惡小而爲之하라", "r": "한소열이 장종에 칙후주왈 물이선소이불위하고 물이악소이위지하라", "k": "한나라 소열황제(유비)가 세상을 떠날 때 아들 후주에게 일렀다. \"착한 일이 작다고 해서 하지 않으면 안 되고, 나쁜 일이 작다고 해서 해서는 안 된다.\""}, {"h": "莊子曰 一日不念善이면 諸惡이 皆自起니라", "r": "장자왈 일일불념선이면 제악이 개자기니라", "k": "장자가 말했다. \"하루라도 착한 일을 생각하지 않으면 온갖 나쁜 마음이 저절로 일어난다.\""}, {"h": "太公曰 見善如渴하고 聞惡如聾하라 又曰 善事란 須貪하고 惡事란 莫樂하라", "r": "태공왈 견선여갈하고 문악여롱하라 우왈 선사란 수탐하고 악사란 막락하라", "k": "태공이 말했다. \"착한 일을 보면 목마른 사람이 물 찾듯 하고, 나쁜 말을 들으면 귀머거리처럼 못 들은 척하라.\" 또 말했다. \"착한 일은 욕심내서라도 하고, 나쁜 일은 즐기지 마라.\""}, {"h": "馬援曰 終身行善이라도 善猶不足이요 一日行惡이라도 惡自有餘니라", "r": "마원왈 종신행선이라도 선유부족이요 일일행악이라도 악자유여니라", "k": "마원이 말했다. \"평생 착한 일을 해도 착함은 오히려 모자라고, 단 하루 나쁜 일을 해도 그 악은 넘치고도 남는다.\""}, {"h": "司馬溫公曰 積金以遺子孫이라도 未必子孫이 能盡守요 積書以遺子孫이라도 未必子孫이 能盡讀이니 不如積陰德於冥冥之中하여 以爲子孫之計也니라", "r": "사마온공왈 적금이유자손이라도 미필자손이 능진수요 적서이유자손이라도 미필자손이 능진독이니 불여적음덕어명명지중하여 이위자손지계야니라", "k": "사마온공이 말했다. \"돈을 모아 자손에게 물려주어도 자손이 다 지킨다는 보장이 없고, 책을 모아 물려주어도 자손이 다 읽는다는 보장이 없다. 남모르게 덕을 쌓아 두는 것이 자손을 위한 가장 좋은 계획이다.\""}, {"h": "景行錄에 曰 恩義를 廣施하라 人生何處不相逢이랴 讐怨을 莫結하라 路逢狹處면 難回避니라", "r": "경행록에 왈 은의를 광시하라 인생하처불상봉이랴 수원을 막결하라 노봉협처면 난회피니라", "k": "경행록에 이르기를, \"은혜와 의리를 널리 베풀어라. 사람이 살다 보면 어디서든 다시 만나게 된다. 원수를 맺지 마라. 좁은 길에서 마주치면 피하기 어렵다.\""}, {"h": "莊子曰 於我善者도 我亦善之하고 於我惡者도 我亦善之니라 我旣於人에 無惡이면 人能於我에 無惡哉인저", "r": "장자왈 어아선자도 아역선지하고 어아악자도 아역선지니라 아기어인에 무악이면 인능어아에 무악재인저", "k": "장자가 말했다. \"나에게 잘해 주는 사람에게도 나는 잘하고, 나에게 못되게 하는 사람에게도 나는 잘해야 한다. 내가 남에게 나쁘게 하지 않았다면, 남도 나에게 나쁘게 할 수 없을 것이다.\""}, {"h": "東岳聖帝垂訓曰 一日行善이면 福雖未至나 禍自遠矣요 一日行惡이면 禍雖未至나 福自遠矣니 行善之人은 如春園之草하여 不見其長이라도 日有所增하고 行惡之人은 如磨刀之石하여 不見其損이라도 日有所虧니라", "r": "동악성제수훈왈 일일행선이면 복수미지나 화자원의요 일일행악이면 화수미지나 복자원의니 행선지인은 여춘원지초하여 불견기장이라도 일유소증하고 행악지인은 여마도지석하여 불견기손이라도 일유소휴니라", "k": "동악성제가 가르쳐 말했다. \"하루 착한 일을 하면 복은 아직 오지 않아도 재앙은 저절로 멀어지고, 하루 나쁜 일을 하면 재앙은 아직 오지 않아도 복은 저절로 멀어진다. 착한 일을 하는 사람은 봄 동산의 풀과 같아서 자라는 것이 눈에 보이지 않아도 날마다 자라고, 나쁜 일을 하는 사람은 칼을 가는 숫돌과 같아서 닳는 것이 보이지 않아도 날마다 줄어든다.\""}, {"h": "子曰 見善如不及하고 見不善如探湯하라", "r": "자왈 견선여불급하고 견불선여탐탕하라", "k": "공자께서 말씀하셨다. \"착한 일을 보면 미치지 못할까 서둘러 따르고, 착하지 않은 일을 보면 끓는 물에 손을 넣은 듯 얼른 피하라.\""}]}, {"t": "천명편", "h": "天命篇", "d": "하늘의 뜻을 따르라는 가르침", "items": [{"h": "孟子曰 順天者는 存하고 逆天者는 亡이니라", "r": "맹자왈 순천자는 존하고 역천자는 망이니라", "k": "맹자가 말했다. \"하늘의 뜻을 따르는 사람은 살아남고, 하늘의 뜻을 거스르는 사람은 망한다.\""}, {"h": "康節邵先生曰 天聽이 寂無音하니 蒼蒼何處尋고 非高亦非遠이라 都只在人心이니라", "r": "강절소선생왈 천청이 적무음하니 창창하처심고 비고역비원이라 도지재인심이니라", "k": "강절 소선생이 말했다. \"하늘은 들어도 소리가 없으니 저 푸른 하늘 어디에서 찾을까. 높지도 멀지도 않으니, 모두 다만 사람의 마음속에 있다.\""}, {"h": "玄帝垂訓曰 人間私語라도 天聽은 若雷하고 暗室欺心이라도 神目은 如電이니라", "r": "현제수훈왈 인간사어라도 천청은 약뢰하고 암실기심이라도 신목은 여전이니라", "k": "현제가 가르쳐 말했다. \"사람끼리 몰래 하는 말도 하늘은 천둥소리처럼 크게 듣고, 어두운 방에서 마음을 속여도 신의 눈은 번개처럼 환히 본다.\""}, {"h": "益智書에 云 惡鑵이 若滿이면 天必誅之니라", "r": "익지서에 운 악관이 약만이면 천필주지니라", "k": "익지서에 이르기를, \"나쁜 짓을 담은 그릇이 가득 차면 하늘이 반드시 벌을 내린다.\""}, {"h": "莊子曰 若人이 作不善하여 得顯名者는 人雖不害나 天必戮之니라", "r": "장자왈 약인이 작불선하여 득현명자는 인수불해나 천필륙지니라", "k": "장자가 말했다. \"만약 사람이 나쁜 짓을 하고도 이름을 떨친다면, 사람은 그를 해치지 않더라도 하늘이 반드시 벌한다.\""}, {"h": "種瓜得瓜요 種豆得豆니 天網이 恢恢하여 疎而不漏니라", "r": "종과득과요 종두득두니 천망이 회회하여 소이불루니라", "k": "오이를 심으면 오이를 얻고, 콩을 심으면 콩을 얻는다. 하늘의 그물은 넓고 넓어서, 성긴 듯하지만 하나도 빠뜨리지 않는다."}, {"h": "子曰 獲罪於天이면 無所禱也니라", "r": "자왈 획죄어천이면 무소도야니라", "k": "공자께서 말씀하셨다. \"하늘에 죄를 지으면 빌 곳이 없다.\""}]}, {"t": "순명편", "h": "順命篇", "d": "운명을 받아들이고 순리대로 살라는 가르침", "items": [{"h": "子曰 死生이 有命이요 富貴在天이니라", "r": "자왈 사생이 유명이요 부귀재천이니라", "k": "공자께서 말씀하셨다. \"죽고 사는 것은 운명에 달려 있고, 부유하고 귀하게 되는 것은 하늘에 달려 있다.\""}, {"h": "萬事分已定이어늘 浮生이 空自忙이니라", "r": "만사분이정이어늘 부생이 공자망이니라", "k": "모든 일은 이미 분수가 정해져 있는데, 덧없는 인생이 공연히 스스로 바쁘다."}, {"h": "景行錄에 云 禍不可倖免이요 福不可再求니라", "r": "경행록에 운 화불가행면이요 복불가재구니라", "k": "경행록에 이르기를, \"재앙은 요행으로 피할 수 없고, 복은 두 번 구할 수 없다.\""}, {"h": "時來風送滕王閣이요 運退雷轟薦福碑라", "r": "시래풍송등왕각이요 운퇴뢰굉천복비라", "k": "때가 오면 바람이 (왕발을) 등왕각까지 실어다 주고, 운이 다하면 벼락이 천복비를 깨뜨린다."}, {"h": "列子曰 癡聾痼瘂도 家豪富요 智慧聰明도 却受貧이라 年月日時 該載定하니 算來由命不由人이니라", "r": "열자왈 치롱고아도 가호부요 지혜총명도 각수빈이라 연월일시 해재정하니 산래유명불유인이니라", "k": "열자가 말했다. \"어리석고 귀먹고 병들고 말 못하는 사람도 큰 부자가 되고, 지혜롭고 총명한 사람도 도리어 가난하게 산다. 태어난 해와 달과 날과 시에 이미 정해져 있으니, 따져 보면 운명에 달린 것이지 사람에게 달린 것이 아니다.\""}]}, {"t": "효행편", "h": "孝行篇", "d": "부모님께 효도하라는 가르침", "items": [{"h": "詩曰 父兮生我하시고 母兮鞠我하시니 哀哀父母여 生我劬勞샷다 欲報深恩인대 昊天罔極이로다", "r": "시왈 부혜생아하시고 모혜국아하시니 애애부모여 생아구로샷다 욕보심은인대 호천망극이로다", "k": "시경에 이르기를, \"아버지는 나를 낳으시고 어머니는 나를 기르셨네. 슬프다 부모님이여, 나를 낳아 기르시느라 얼마나 애쓰셨던가. 그 깊은 은혜를 갚고자 하니 하늘처럼 끝이 없구나.\""}, {"h": "子曰 孝子之事親也에 居則致其敬하고 養則致其樂하고 病則致其憂하고 喪則致其哀하고 祭則致其嚴이니라", "r": "자왈 효자지사친야에 거즉치기경하고 양즉치기락하고 병즉치기우하고 상즉치기애하고 제즉치기엄이니라", "k": "공자께서 말씀하셨다. \"효자가 부모를 섬길 때는, 평소에는 공경을 다하고, 봉양할 때는 즐겁게 해 드리고, 병드시면 근심을 다하고, 돌아가시면 슬픔을 다하고, 제사 지낼 때는 엄숙함을 다한다.\""}, {"h": "子曰 父母在어시든 不遠遊하며 遊必有方이니라", "r": "자왈 부모재어시든 불원유하며 유필유방이니라", "k": "공자께서 말씀하셨다. \"부모님이 살아 계시면 멀리 떠나 놀지 말고, 떠날 때는 반드시 가는 곳을 알려 드려야 한다.\""}, {"h": "子曰 父命召어시든 唯而不諾하고 食在口則吐之니라", "r": "자왈 부명소어시든 유이불낙하고 식재구즉토지니라", "k": "공자께서 말씀하셨다. \"아버지가 부르시면 머뭇거리지 말고 곧바로 '예' 하고 대답하며, 음식이 입에 있으면 뱉고 달려가야 한다.\""}, {"h": "太公曰 孝於親이면 子亦孝之하나니 身旣不孝면 子何孝焉이리오", "r": "태공왈 효어친이면 자역효지하나니 신기불효면 자하효언이리오", "k": "태공이 말했다. \"내가 부모에게 효도하면 내 자식도 나에게 효도한다. 내가 효도하지 않았는데 자식이 어찌 나에게 효도하겠는가.\""}, {"h": "孝順은 還生孝順子요 忤逆은 還生忤逆子하나니 不信커든 但看簷頭水하라 點點滴滴不差移니라", "r": "효순은 환생효순자요 오역은 환생오역자하나니 불신커든 단간첨두수하라 점점적적불차이니라", "k": "효도하고 순종하는 사람은 다시 효도하고 순종하는 자식을 낳고, 부모를 거스르는 사람은 다시 거스르는 자식을 낳는다. 믿지 못하겠거든 처마 끝의 빗물을 보라. 방울방울 떨어지는 자리가 조금도 어긋나지 않는다."}]}, {"t": "정기편", "h": "正己篇", "d": "자기 자신을 바르게 하라는 가르침", "items": [{"h": "性理書에 云 見人之善而尋己之善하고 見人之惡而尋己之惡이니 如此라야 方是有益이니라", "r": "성리서에 운 견인지선이심기지선하고 견인지악이심기지악이니 여차라야 방시유익이니라", "k": "성리서에 이르기를, \"남의 착한 점을 보면 나에게도 그런 점이 있는지 찾아보고, 남의 나쁜 점을 보면 나에게도 그런 점이 있는지 찾아보아야 한다. 이렇게 해야 비로소 유익하다.\""}, {"h": "景行錄에 云 大丈夫는 當容人이언정 無爲人所容이니라", "r": "경행록에 운 대장부는 당용인이언정 무위인소용이니라", "k": "경행록에 이르기를, \"대장부는 마땅히 남을 너그럽게 감싸 줄지언정, 남에게 감싸임을 받는 사람이 되어서는 안 된다.\""}, {"h": "太公曰 勿以貴己而賤人하고 勿以自大而蔑小하고 勿以恃勇而輕敵이니라", "r": "태공왈 물이귀기이천인하고 물이자대이멸소하고 물이시용이경적이니라", "k": "태공이 말했다. \"내가 귀하다고 남을 천하게 여기지 말고, 내가 크다고 작은 사람을 업신여기지 말고, 내 용맹을 믿고 적을 가볍게 보지 마라.\""}, {"h": "馬援曰 聞人之過失이어든 如聞父母之名하여 耳可得聞이언정 口不可言也니라", "r": "마원왈 문인지과실이어든 여문부모지명하여 이가득문이언정 구불가언야니라", "k": "마원이 말했다. \"남의 잘못을 듣거든 부모님의 이름을 들은 것처럼 하여, 귀로 들을 수는 있어도 입으로 말해서는 안 된다.\""}, {"h": "康節邵先生曰 聞人之謗이라도 未嘗怒하며 聞人之譽라도 未嘗喜하며 聞人之惡이라도 未嘗和하며 聞人之善則就而和之하고 又從而喜之니라 其詩에 曰 樂見善人하며 樂聞善事하며 樂道善言하며 樂行善意하고 聞人之惡이어든 如負芒刺하고 聞人之善이어든 如佩蘭蕙니라", "r": "강절소선생왈 문인지방이라도 미상노하며 문인지예라도 미상희하며 문인지악이라도 미상화하며 문인지선즉취이화지하고 우종이희지니라 기시에 왈 낙견선인하며 낙문선사하며 낙도선언하며 낙행선의하고 문인지악이어든 여부망자하고 문인지선이어든 여패난혜니라", "k": "강절 소선생이 말했다. \"남이 나를 헐뜯어도 화내지 않고, 남이 나를 칭찬해도 기뻐하지 않으며, 남의 나쁜 점을 들어도 맞장구치지 않고, 남의 좋은 점을 들으면 다가가 함께 칭찬하고 기뻐한다.\" 그의 시에 이르기를, \"착한 사람 보기를 즐기고, 착한 일 듣기를 즐기며, 착한 말 하기를 즐기고, 착한 뜻 행하기를 즐긴다. 남의 나쁜 점을 들으면 가시를 등에 진 듯 괴로워하고, 남의 좋은 점을 들으면 난초를 몸에 지닌 듯 향기롭게 여긴다.\""}, {"h": "道吾善者는 是吾賊이요 道吾惡者는 是吾師니라", "r": "도오선자는 시오적이요 도오악자는 시오사니라", "k": "나를 좋게만 말해 주는 사람은 나를 해치는 사람이고, 나의 잘못을 말해 주는 사람은 나의 스승이다."}, {"h": "太公曰 勤爲無價之寶요 愼是護身之符니라", "r": "태공왈 근위무가지보요 신시호신지부니라", "k": "태공이 말했다. \"부지런함은 값을 매길 수 없는 보배이고, 조심함은 몸을 지키는 부적이다.\""}, {"h": "景行錄에 云 保生者는 寡慾하고 保身者는 避名이니 無慾은 易나 無名은 難이니라", "r": "경행록에 운 보생자는 과욕하고 보신자는 피명이니 무욕은 이나 무명은 난이니라", "k": "경행록에 이르기를, \"생명을 보존하려는 사람은 욕심을 줄이고, 몸을 보존하려는 사람은 이름 내기를 피한다. 욕심을 없애기는 쉬우나 이름을 탐하지 않기는 어렵다.\""}, {"h": "子曰 君子有三戒하니 少之時엔 血氣未定이라 戒之在色하고 及其壯也하여는 血氣方剛이라 戒之在鬪하고 及其老也하여는 血氣旣衰라 戒之在得이니라", "r": "자왈 군자유삼계하니 소지시엔 혈기미정이라 계지재색하고 급기장야하여는 혈기방강이라 계지재투하고 급기로야하여는 혈기기쇠라 계지재득이니라", "k": "공자께서 말씀하셨다. \"군자에게는 경계할 것이 세 가지 있다. 젊을 때는 혈기가 안정되지 않았으니 여색을 경계하고, 장성해서는 혈기가 한창 강하니 싸움을 경계하고, 늙어서는 혈기가 이미 쇠했으니 욕심내어 얻으려는 것을 경계해야 한다.\""}, {"h": "孫眞人養生銘에 云 怒甚偏傷氣요 思多太損神이라 神疲心易役이요 氣弱病相因이라 勿使悲歡極하고 當令飮食均하며 再三防夜醉하고 第一戒晨嗔하라", "r": "손진인양생명에 운 노심편상기요 사다태손신이라 신피심이역이요 기약병상인이라 물사비환극하고 당령음식균하며 재삼방야취하고 제일계신진하라", "k": "손진인의 양생명에 이르기를, \"화를 심하게 내면 기운을 상하고, 생각이 많으면 정신을 크게 해친다. 정신이 피로하면 마음이 쉽게 지치고, 기운이 약하면 병이 따라온다. 슬픔과 기쁨을 지나치게 하지 말고, 음식은 고르게 먹으며, 밤에 취하는 것을 거듭 막고, 무엇보다 아침에 성내는 것을 경계하라.\""}, {"h": "景行錄에 云 食淡精神爽이요 心淸夢寐安이니라", "r": "경행록에 운 식담정신상이요 심청몽매안이니라", "k": "경행록에 이르기를, \"음식을 담백하게 먹으면 정신이 맑고, 마음이 깨끗하면 잠자리가 편안하다.\""}, {"h": "定心應物하면 雖不讀書라도 可以爲有德君子니라", "r": "정심응물하면 수부독서라도 가이위유덕군자니라", "k": "마음을 바로잡고 세상일을 대하면, 비록 책을 읽지 않았더라도 덕 있는 군자가 될 수 있다."}, {"h": "近思錄에 云 懲忿을 如救火하고 窒慾을 如防水하라", "r": "근사록에 운 징분을 여구화하고 질욕을 여방수하라", "k": "근사록에 이르기를, \"분노를 다스리기를 불을 끄듯 하고, 욕심을 막기를 홍수를 막듯 하라.\""}, {"h": "夷堅志에 云 避色如避讐하고 避風如避箭하며 莫喫空心茶하고 少食中夜飯하라", "r": "이견지에 운 피색여피수하고 피풍여피전하며 막끽공심다하고 소식중야반하라", "k": "이견지에 이르기를, \"여색을 원수 피하듯 하고, 찬 바람을 화살 피하듯 하며, 빈속에 차를 마시지 말고, 한밤중에는 밥을 적게 먹어라.\""}, {"h": "荀子曰 無用之辯과 不急之察을 棄而勿治하라", "r": "순자왈 무용지변과 불급지찰을 기이물치하라", "k": "순자가 말했다. \"쓸데없는 말다툼과 급하지 않은 따짐은 내버려 두고 하지 마라.\""}, {"h": "子曰 衆이 好之라도 必察焉하며 衆이 惡之라도 必察焉이니라", "r": "자왈 중이 호지라도 필찰언하며 중이 오지라도 필찰언이니라", "k": "공자께서 말씀하셨다. \"여러 사람이 좋아하더라도 반드시 살펴보고, 여러 사람이 미워하더라도 반드시 살펴보아야 한다.\""}, {"h": "酒中不語는 眞君子요 財上分明은 大丈夫니라", "r": "주중불어는 진군자요 재상분명은 대장부니라", "k": "술자리에서 말을 삼가는 사람이 참된 군자이고, 돈 문제에 분명한 사람이 대장부이다."}, {"h": "萬事從寬이면 其福自厚니라", "r": "만사종관이면 기복자후니라", "k": "모든 일을 너그럽게 처리하면 그 복이 저절로 두터워진다."}, {"h": "太公曰 欲量他人인대 先須自量하라 傷人之語는 還是自傷이니 含血噴人이면 先汚其口니라", "r": "태공왈 욕량타인인대 선수자량하라 상인지어는 환시자상이니 함혈분인이면 선오기구니라", "k": "태공이 말했다. \"남을 헤아리려거든 먼저 자신을 헤아려라. 남을 해치는 말은 도리어 자신을 해친다. 피를 머금어 남에게 뿜으면 먼저 내 입이 더러워진다.\""}, {"h": "凡戱는 無益이요 惟勤이 有功이니라", "r": "범희는 무익이요 유근이 유공이니라", "k": "모든 놀이는 이로움이 없고, 오직 부지런함만이 보람이 있다."}, {"h": "太公曰 瓜田에 不納履하고 李下에 不正冠이니라", "r": "태공왈 과전에 불납리하고 이하에 부정관이니라", "k": "태공이 말했다. \"오이 밭에서는 신발을 고쳐 신지 말고, 자두나무 아래에서는 갓을 고쳐 쓰지 마라.\" (남에게 의심받을 행동을 하지 말라는 뜻)"}, {"h": "景行錄에 云 心可逸이언정 形不可不勞요 道可樂이언정 心不可不憂니 形不勞則怠惰易弊하고 心不憂則荒淫不定故로 逸生於勞而常休하고 樂生於憂而無厭하나니 逸樂者는 憂勞를 其可忘乎아", "r": "경행록에 운 심가일이언정 형불가불로요 도가락이언정 심불가불우니 형불로즉태타이폐하고 심불우즉황음부정고로 일생어로이상휴하고 낙생어우이무염하나니 일락자는 우로를 기가망호아", "k": "경행록에 이르기를, \"마음은 편안할 수 있어도 몸은 수고하지 않으면 안 되고, 도는 즐길 수 있어도 마음은 근심하지 않으면 안 된다. 몸이 수고하지 않으면 게을러져 무너지기 쉽고, 마음이 근심하지 않으면 방탕해져 안정되지 못한다. 그러므로 편안함은 수고에서 생겨 늘 쉴 수 있고, 즐거움은 근심에서 생겨 싫증이 나지 않는다. 편안하고 즐겁고자 하는 사람이 어찌 근심과 수고를 잊을 수 있겠는가.\""}, {"h": "耳不聞人之非하고 目不視人之短하고 口不言人之過라야 庶幾君子니라", "r": "이불문인지비하고 목불시인지단하고 구불언인지과라야 서기군자니라", "k": "귀로는 남의 그릇됨을 듣지 않고, 눈으로는 남의 단점을 보지 않고, 입으로는 남의 허물을 말하지 않아야 군자에 가깝다."}, {"h": "蔡伯喈曰 喜怒는 在心하고 言出於口하나니 不可不愼이니라", "r": "채백개왈 희로는 재심하고 언출어구하나니 불가불신이니라", "k": "채백개가 말했다. \"기쁨과 노여움은 마음에 있고 말은 입에서 나오니, 삼가지 않으면 안 된다.\""}, {"h": "宰予晝寢이어늘 子曰 朽木은 不可雕也요 糞土之墻은 不可圬也니라", "r": "재여주침이어늘 자왈 후목은 불가조야요 분토지장은 불가오야니라", "k": "재여가 낮잠을 자자 공자께서 말씀하셨다. \"썩은 나무에는 조각할 수 없고, 거름흙으로 쌓은 담장에는 흙손질을 할 수 없다.\""}, {"h": "紫虛元君誠諭心文에 曰 福生於淸儉하고 德生於卑退하고 道生於安靜하고 命生於和暢하고 患生於多慾하고 禍生於多貪하고 過生於輕慢하고 罪生於不仁이니라", "r": "자허원군성유심문에 왈 복생어청검하고 덕생어비퇴하고 도생어안정하고 명생어화창하고 환생어다욕하고 화생어다탐하고 과생어경만하고 죄생어불인이니라", "k": "자허원군의 성유심문에 이르기를, \"복은 깨끗하고 검소한 데서 생기고, 덕은 자신을 낮추고 물러서는 데서 생기며, 도는 편안하고 고요한 데서 생기고, 목숨은 화평하고 즐거운 데서 생긴다. 근심은 욕심이 많은 데서 생기고, 재앙은 탐욕이 많은 데서 생기며, 허물은 가볍고 거만한 데서 생기고, 죄는 어질지 못한 데서 생긴다.\""}, {"h": "戒眼莫看他非하고 戒口莫談他短하고 戒心莫自貪嗔하고 戒身莫隨惡伴하라 無益之言을 莫妄說하고 不干己事를 莫妄爲하라", "r": "계안막간타비하고 계구막담타단하고 계심막자탐진하고 계신막수악반하라 무익지언을 막망설하고 불간기사를 막망위하라", "k": "(앞 구절에 이어서) \"눈을 단속하여 남의 그릇됨을 보지 말고, 입을 단속하여 남의 단점을 말하지 말며, 마음을 단속하여 스스로 탐내거나 성내지 말고, 몸을 단속하여 나쁜 친구를 따르지 마라. 이로울 것 없는 말을 함부로 하지 말고, 나와 상관없는 일을 함부로 하지 마라.\""}, {"h": "尊君王孝父母하며 敬尊長奉有德하며 別賢愚恕無識하라 物順來而勿拒하며 物旣去而勿追하며 身未遇而勿望하며 事已過而勿思하라", "r": "존군왕효부모하며 경존장봉유덕하며 별현우서무식하라 물순래이물거하며 물기거이물추하며 신미우이물망하며 사이과이물사하라", "k": "(이어서) \"임금을 높이고 부모께 효도하며, 어른을 공경하고 덕 있는 사람을 받들며, 어진 이와 어리석은 이를 가리되 모르는 사람은 용서하라. 일이 순리대로 오면 막지 말고, 이미 지나갔으면 붙잡지 말며, 아직 때를 만나지 못했으면 바라지 말고, 일이 이미 지났으면 다시 생각하지 마라.\""}, {"h": "聰明도 多暗昧요 算計도 失便宜니라 損人終自失이요 依勢禍相隨라 戒之在心하고 守之在氣라 爲不節而亡家하고 因不廉而失位니라", "r": "총명도 다암매요 산계도 실편의니라 손인종자실이요 의세화상수라 계지재심하고 수지재기라 위부절이망가하고 인불렴이실위니라", "k": "(이어서) \"총명한 사람도 어두운 때가 많고, 계산을 잘해도 손해를 본다. 남을 해치면 끝내 자신이 잃게 되고, 권세에 기대면 재앙이 따른다. 경계는 마음에 있고 지킴은 기운에 있다. 절제하지 못해 집안을 망치고, 청렴하지 못해 지위를 잃는다.\""}, {"h": "勸君自警於平生하나니 可歎可驚而可畏니라 上臨之以天鑑하고 下察之以地祇라 明有王法相繼하고 暗有鬼神相隨라 惟正可守요 心不可欺니 戒之戒之하라", "r": "권군자경어평생하나니 가탄가경이가외니라 상림지이천감하고 하찰지이지기라 명유왕법상계하고 암유귀신상수라 유정가수요 심불가기니 계지계지하라", "k": "(이어서) \"그대에게 권하노니 평생 스스로 깨우쳐라. 탄식할 만하고 놀랄 만하며 두려워할 만하다. 위로는 하늘의 거울이 내려다보고, 아래로는 땅의 신이 살핀다. 밝은 곳에는 나라의 법이 이어지고, 어두운 곳에는 귀신이 따른다. 오직 바른 것을 지키고 마음을 속이지 말지니, 경계하고 또 경계하라.\""}]}, {"t": "안분편", "h": "安分篇", "d": "자기 분수를 알고 편안히 지키라는 가르침", "items": [{"h": "景行錄에 云 知足可樂이요 務貪則憂니라", "r": "경행록에 운 지족가락이요 무탐즉우니라", "k": "경행록에 이르기를, \"만족할 줄 알면 즐거울 수 있고, 탐욕에 힘쓰면 근심하게 된다.\""}, {"h": "知足者는 貧賤亦樂이요 不知足者는 富貴亦憂니라", "r": "지족자는 빈천역락이요 부지족자는 부귀역우니라", "k": "만족할 줄 아는 사람은 가난하고 천해도 즐겁고, 만족할 줄 모르는 사람은 부유하고 귀해도 근심한다."}, {"h": "濫想은 徒傷神이요 妄動은 反致禍니라", "r": "남상은 도상신이요 망동은 반치화니라", "k": "지나친 생각은 정신만 상하게 하고, 함부로 하는 행동은 도리어 재앙을 부른다."}, {"h": "知足常足이면 終身不辱하고 知止常止면 終身無恥니라", "r": "지족상족이면 종신불욕하고 지지상지면 종신무치니라", "k": "만족할 줄 알아 늘 만족하면 평생 욕되지 않고, 그칠 줄 알아 늘 그치면 평생 부끄러움이 없다."}, {"h": "書에 曰 滿招損하고 謙受益이니라", "r": "서에 왈 만초손하고 겸수익이니라", "k": "서경에 이르기를, \"가득 차면 손해를 부르고, 겸손하면 이익을 얻는다.\""}, {"h": "安分吟에 曰 安分身無辱이요 知機心自閑이니 雖居人世上이나 却是出人間이니라", "r": "안분음에 왈 안분신무욕이요 지기심자한이니 수거인세상이나 각시출인간이니라", "k": "안분음에 이르기를, \"분수를 지키면 몸에 욕됨이 없고, 때를 알면 마음이 저절로 한가롭다. 비록 사람 사는 세상에 살아도 도리어 세상을 벗어난 것과 같다.\""}, {"h": "子曰 不在其位하여는 不謀其政이니라", "r": "자왈 부재기위하여는 불모기정이니라", "k": "공자께서 말씀하셨다. \"그 자리에 있지 않으면 그 자리의 일을 꾀하지 않는다.\""}]}, {"t": "존심편", "h": "存心篇", "d": "바른 마음을 지니라는 가르침", "items": [{"h": "景行錄에 云 坐密室을 如通衢하고 馭寸心을 如六馬면 可免過니라", "r": "경행록에 운 좌밀실을 여통구하고 어촌심을 여육마면 가면과니라", "k": "경행록에 이르기를, \"깊숙한 방에 앉아 있어도 큰길 네거리에 있는 듯 조심하고, 작은 마음 다스리기를 여섯 필 말 몰듯 하면 허물을 면할 수 있다.\""}, {"h": "擊壤詩에 云 富貴를 如將智力求인대 仲尼年少合封侯라 世人은 不解靑天意하고 空使身心半夜愁니라", "r": "격양시에 운 부귀를 여장지력구인대 중니연소합봉후라 세인은 불해청천의하고 공사신심반야수니라", "k": "격양시에 이르기를, \"부귀를 지혜와 힘으로 얻을 수 있다면 공자는 젊어서 벌써 제후가 되었으리라. 세상 사람들은 푸른 하늘의 뜻을 알지 못하고, 공연히 몸과 마음을 한밤중까지 근심하게 한다.\""}, {"h": "范忠宣公이 戒子弟曰 人雖至愚나 責人則明하고 雖有聰明이나 恕己則昏이니 爾曹는 但常以責人之心으로 責己하고 恕己之心으로 恕人則不患不到聖賢地位也니라", "r": "범충선공이 계자제왈 인수지우나 책인즉명하고 수유총명이나 서기즉혼이니 이조는 단상이책인지심으로 책기하고 서기지심으로 서인즉불환부도성현지위야니라", "k": "범충선공이 자제들을 타일러 말했다. \"사람은 아무리 어리석어도 남을 꾸짖는 데는 밝고, 아무리 총명해도 자기를 용서하는 데는 어둡다. 너희는 늘 남을 꾸짖는 마음으로 자신을 꾸짖고, 자신을 용서하는 마음으로 남을 용서하라. 그러면 성현의 경지에 이르지 못할까 걱정할 필요가 없다.\""}, {"h": "子曰 聰明思睿라도 守之以愚하고 功被天下라도 守之以讓하고 勇力振世라도 守之以怯하고 富有四海라도 守之以謙이니라", "r": "자왈 총명사예라도 수지이우하고 공피천하라도 수지이양하고 용력진세라도 수지이겁하고 부유사해라도 수지이겸이니라", "k": "공자께서 말씀하셨다. \"총명하고 생각이 슬기로워도 어리석은 듯 지키고, 공이 천하를 덮어도 사양하는 마음으로 지키며, 용맹이 세상을 떨쳐도 겁내는 듯 지키고, 부유함이 온 세상을 가져도 겸손함으로 지켜야 한다.\""}, {"h": "素書에 云 薄施厚望者는 不報하고 貴而忘賤者는 不久니라", "r": "소서에 운 박시후망자는 불보하고 귀이망천자는 불구니라", "k": "소서에 이르기를, \"조금 베풀고 많이 바라는 사람은 보답을 받지 못하고, 귀하게 되어 천했던 때를 잊는 사람은 오래가지 못한다.\""}, {"h": "施恩이어든 勿求報하고 與人이어든 勿追悔하라", "r": "시은이어든 물구보하고 여인이어든 물추회하라", "k": "은혜를 베풀었으면 보답을 바라지 말고, 남에게 주었으면 나중에 후회하지 마라."}, {"h": "孫思邈曰 膽欲大而心欲小하고 知欲圓而行欲方이니라", "r": "손사막왈 담욕대이심욕소하고 지욕원이행욕방이니라", "k": "손사막이 말했다. \"담력은 크게 가지되 마음은 세심하게 쓰고, 지혜는 원만하게 하되 행동은 반듯하게 하라.\""}, {"h": "念念要如臨戰日하고 心心常似過橋時니라", "r": "염념요여임전일하고 심심상사과교시니라", "k": "생각마다 싸움터에 나가는 날처럼 하고, 마음마다 늘 외나무다리를 건너는 때처럼 조심하라."}, {"h": "懼法朝朝樂이요 欺公日日憂니라", "r": "구법조조락이요 기공일일우니라", "k": "법을 두려워하면 아침마다 즐겁고, 나랏일을 속이면 날마다 근심한다."}, {"h": "朱文公曰 守口如甁하고 防意如城하라", "r": "주문공왈 수구여병하고 방의여성하라", "k": "주문공(주자)이 말했다. \"입 지키기를 병마개 막듯 하고, 나쁜 생각 막기를 성을 지키듯 하라.\""}, {"h": "心不負人이면 面無慚色이니라", "r": "심불부인이면 면무참색이니라", "k": "마음에 남을 저버린 일이 없으면 얼굴에 부끄러운 빛이 없다."}, {"h": "人無百歲人이나 枉作千年計니라", "r": "인무백세인이나 왕작천년계니라", "k": "사람은 백 년을 사는 이도 없는데, 부질없이 천 년의 계획을 세운다."}, {"h": "寇萊公六悔銘에 云 官行私曲失時悔요 富不儉用貧時悔요 藝不少學過時悔요 見事不學用時悔요 醉後狂言醒時悔요 安不將息病時悔니라", "r": "구래공육회명에 운 관행사곡실시회요 부불검용빈시회요 예불소학과시회요 견사불학용시회요 취후광언성시회요 안부장식병시회니라", "k": "구래공의 여섯 가지 후회에 이르기를, \"벼슬할 때 사사롭게 굽은 일을 하면 자리를 잃을 때 후회하고, 부유할 때 아껴 쓰지 않으면 가난할 때 후회하며, 재주를 젊어서 배우지 않으면 때가 지난 뒤 후회하고, 일을 보고도 배우지 않으면 쓸 때 후회하며, 취한 뒤 함부로 말하면 술 깬 뒤 후회하고, 편안할 때 몸을 돌보지 않으면 병들었을 때 후회한다.\""}, {"h": "益智書에 云 寧無事而家貧이언정 莫有事而家富요 寧無事而住茅屋이언정 不有事而住金屋이요 寧無病而食麤飯이언정 不有病而服良藥이니라", "r": "익지서에 운 영무사이가빈이언정 막유사이가부요 영무사이주모옥이언정 불유사이주금옥이요 영무병이식추반이언정 불유병이복양약이니라", "k": "익지서에 이르기를, \"차라리 탈 없이 가난할지언정 탈 있으면서 부자가 되지 말고, 차라리 탈 없이 초가집에 살지언정 탈 있으면서 좋은 집에 살지 말며, 차라리 병 없이 거친 밥을 먹을지언정 병들어 좋은 약을 먹지 마라.\""}, {"h": "心安茅屋穩이요 性定菜羹香이니라", "r": "심안모옥온이요 성정채갱향이니라", "k": "마음이 편안하면 초가집도 아늑하고, 성품이 안정되면 나물국도 향기롭다."}, {"h": "景行錄에 云 責人者는 不全交요 自恕者는 不改過니라", "r": "경행록에 운 책인자는 부전교요 자서자는 불개과니라", "k": "경행록에 이르기를, \"남을 꾸짖기만 하는 사람은 사귐을 온전히 하지 못하고, 자기를 용서하기만 하는 사람은 허물을 고치지 못한다.\""}]}, {"t": "계성편", "h": "戒性篇", "d": "성품을 다스리고 참으라는 가르침", "items": [{"h": "景行錄에 云 人性이 如水하여 水一傾則不可復이요 性一縱則不可反이니 制水者는 必以堤防하고 制性者는 必以禮法이니라", "r": "경행록에 운 인성이 여수하여 수일경즉불가복이요 성일종즉불가반이니 제수자는 필이제방하고 제성자는 필이예법이니라", "k": "경행록에 이르기를, \"사람의 성품은 물과 같아서, 물이 한번 쏟아지면 되돌릴 수 없고 성품이 한번 풀어지면 되돌릴 수 없다. 물을 다스리려면 반드시 둑을 쌓아야 하고, 성품을 다스리려면 반드시 예법으로 해야 한다.\""}, {"h": "忍一時之忿이면 免百日之憂니라", "r": "인일시지분이면 면백일지우니라", "k": "한때의 분함을 참으면 백 날의 근심을 면한다."}, {"h": "得忍且忍이요 得戒且戒하라 不忍不戒면 小事成大니라", "r": "득인차인이요 득계차계하라 불인불계면 소사성대니라", "k": "참을 수 있으면 우선 참고, 경계할 수 있으면 우선 경계하라. 참지 못하고 경계하지 못하면 작은 일이 큰일이 된다."}, {"h": "愚濁生嗔怒는 皆因理不通이라 休添心上火하고 只作耳邊風하라 長短은 家家有요 炎涼은 處處同이라 是非無實相하여 究竟摠成空이니라", "r": "우탁생진노는 개인리불통이라 휴첨심상화하고 지작이변풍하라 장단은 가가유요 염량은 처처동이라 시비무실상하여 구경총성공이니라", "k": "어리석고 흐린 사람이 성을 내는 것은 모두 이치를 깨닫지 못했기 때문이다. 마음 위에 불을 더하지 말고, 그저 귀 옆을 스치는 바람으로 여겨라. 잘하고 못하는 것은 집집마다 있고, 따뜻하고 서늘한 세상 인심은 어디나 같다. 옳고 그름은 실체가 없어서 결국 모두 빈 것이 된다."}, {"h": "子張이 欲行에 辭於夫子할새 願賜一言하여 爲修身之美하소서 子曰 百行之本이 忍之爲上이니라", "r": "자장이 욕행에 사어부자할새 원사일언하여 위수신지미하소서 자왈 백행지본이 인지위상이니라", "k": "자장이 길을 떠나려고 공자께 인사하며 말했다. \"몸을 닦는 데 도움이 될 한 말씀을 주십시오.\" 공자께서 말씀하셨다. \"모든 행실의 근본은 참는 것이 으뜸이다.\""}, {"h": "子張曰 何爲忍之니잇고 子曰 天子忍之면 國無害하고 諸侯忍之면 成其大하고 官吏忍之면 進其位하고 兄弟忍之면 家富貴하고 夫妻忍之면 終其世하고 朋友忍之면 名不廢하고 自身忍之면 無禍害니라", "r": "자장왈 하위인지니잇고 자왈 천자인지면 국무해하고 제후인지면 성기대하고 관리인지면 진기위하고 형제인지면 가부귀하고 부처인지면 종기세하고 붕우인지면 명불폐하고 자신인지면 무화해니라", "k": "(이어서) 자장이 \"참으면 어떻게 됩니까?\" 하고 묻자 공자께서 말씀하셨다. \"천자가 참으면 나라에 해가 없고, 제후가 참으면 큰 나라를 이루며, 관리가 참으면 벼슬이 오르고, 형제가 참으면 집안이 부귀해지며, 부부가 참으면 평생을 함께하고, 친구끼리 참으면 우정의 이름이 사라지지 않으며, 자신이 참으면 재앙이 없다.\""}, {"h": "子張曰 不忍則如何니잇고 子曰 天子不忍이면 國空虛하고 諸侯不忍이면 喪其軀하고 官吏不忍이면 刑法誅하고 兄弟不忍이면 各分居하고 夫妻不忍이면 令子孤하고 朋友不忍이면 情意疎하고 自身不忍이면 患不除니라 子張曰 善哉善哉라 難忍難忍이여 非人不忍이요 不忍非人이로다", "r": "자장왈 불인즉여하니잇고 자왈 천자불인이면 국공허하고 제후불인이면 상기구하고 관리불인이면 형법주하고 형제불인이면 각분거하고 부처불인이면 영자고하고 붕우불인이면 정의소하고 자신불인이면 환부제니라 자장왈 선재선재라 난인난인이여 비인불인이요 불인비인이로다", "k": "(이어서) 자장이 \"참지 못하면 어떻게 됩니까?\" 하고 묻자 공자께서 말씀하셨다. \"천자가 참지 못하면 나라가 텅 비고, 제후가 참지 못하면 제 몸을 잃으며, 관리가 참지 못하면 법에 따라 벌을 받고, 형제가 참지 못하면 서로 갈라져 살며, 부부가 참지 못하면 자식을 외롭게 만들고, 친구끼리 참지 못하면 정이 멀어지며, 자신이 참지 못하면 근심이 없어지지 않는다.\" 자장이 말했다. \"참으로 좋은 말씀입니다. 참기는 어렵고도 어렵구나. 사람이 아니면 참지 못하고, 참지 못하면 사람이 아니로다.\""}, {"h": "景行錄에 云 屈己者는 能處重하고 好勝者는 必遇敵이니라", "r": "경행록에 운 굴기자는 능처중하고 호승자는 필우적이니라", "k": "경행록에 이르기를, \"자기를 굽힐 줄 아는 사람은 중요한 자리를 맡을 수 있고, 이기기를 좋아하는 사람은 반드시 적을 만난다.\""}, {"h": "惡人이 罵善人이어든 善人은 摠不對하라 不對는 心淸閑이요 罵者는 口熱沸니라 正如人唾天하여 還從己身墜니라", "r": "악인이 매선인이어든 선인은 총부대하라 부대는 심청한이요 매자는 구열비니라 정여인타천하여 환종기신추니라", "k": "나쁜 사람이 착한 사람을 욕하거든 착한 사람은 아예 대꾸하지 마라. 대꾸하지 않으면 마음이 맑고 한가롭지만, 욕하는 사람은 입만 뜨겁게 끓는다. 이는 마치 사람이 하늘에 침을 뱉으면 도로 제 몸에 떨어지는 것과 같다."}, {"h": "我若被人罵라도 佯聾不分說하라 譬如火燒空하여 不救自然滅이니라 我心은 等虛空이어늘 摠爾飜脣舌이니라", "r": "아약피인매라도 양롱불분설하라 비여화소공하여 불구자연멸이니라 아심은 등허공이어늘 총이번순설이니라", "k": "내가 만약 남에게 욕을 듣더라도 귀머거리인 척하고 따지지 마라. 비유하면 불이 허공에서 타는 것과 같아서 끄지 않아도 저절로 꺼진다. 내 마음은 텅 빈 허공과 같은데, 너는 공연히 입술과 혀만 놀리는구나."}, {"h": "凡事에 留人情이면 後來에 好相見이니라", "r": "범사에 유인정이면 후래에 호상견이니라", "k": "모든 일에 인정을 남겨 두면 나중에 좋은 얼굴로 다시 만날 수 있다."}]}, {"t": "근학편", "h": "勤學篇", "d": "부지런히 배우라는 가르침", "items": [{"h": "子曰 博學而篤志하고 切問而近思면 仁在其中矣니라", "r": "자왈 박학이독지하고 절문이근사면 인재기중의니라", "k": "공자께서 말씀하셨다. \"널리 배우고 뜻을 두텁게 하며, 간절히 묻고 가까운 것부터 생각하면 어짊은 그 가운데 있다.\""}, {"h": "莊子曰 人之不學이 如登天而無術하고 學而智遠이면 如披祥雲而覩靑天하고 登高山而望四海니라", "r": "장자왈 인지불학이 여등천이무술하고 학이지원이면 여피상운이도청천하고 등고산이망사해니라", "k": "장자가 말했다. \"사람이 배우지 않는 것은 재주 없이 하늘에 오르려는 것과 같다. 배워서 지혜가 깊어지면 상서로운 구름을 헤치고 푸른 하늘을 보는 것과 같고, 높은 산에 올라 온 세상을 바라보는 것과 같다.\""}, {"h": "禮記에 曰 玉不琢이면 不成器하고 人不學이면 不知義니라", "r": "예기에 왈 옥불탁이면 불성기하고 인불학이면 부지의니라", "k": "예기에 이르기를, \"옥은 다듬지 않으면 그릇이 되지 못하고, 사람은 배우지 않으면 의리를 알지 못한다.\""}, {"h": "太公曰 人生不學이면 如冥冥夜行이니라", "r": "태공왈 인생불학이면 여명명야행이니라", "k": "태공이 말했다. \"사람이 태어나서 배우지 않으면 캄캄한 밤길을 가는 것과 같다.\""}, {"h": "韓文公曰 人不通古今이면 馬牛而襟裾니라", "r": "한문공왈 인불통고금이면 마우이금거니라", "k": "한문공(한유)이 말했다. \"사람이 옛날과 지금의 일에 통하지 못하면 말이나 소에게 옷을 입혀 놓은 것과 같다.\""}, {"h": "朱文公曰 家若貧이라도 不可因貧而廢學이요 家若富라도 不可恃富而怠學이니 貧若勤學이면 可以立身이요 富若勤學이면 名乃光榮하리라 惟見學者顯達이요 不見學者無成이니라 學者는 乃身之寶요 學者는 乃世之珍이라 是故로 學則乃爲君子요 不學則爲小人이니 後之學者는 宜各勉之니라", "r": "주문공왈 가약빈이라도 불가인빈이폐학이요 가약부라도 불가시부이태학이니 빈약근학이면 가이입신이요 부약근학이면 명내광영하리라 유견학자현달이요 불견학자무성이니라 학자는 내신지보요 학자는 내세지진이라 시고로 학즉내위군자요 불학즉위소인이니 후지학자는 의각면지니라", "k": "주문공(주자)이 말했다. \"집이 가난해도 가난 때문에 배움을 그만두어서는 안 되고, 집이 부유해도 부유함을 믿고 배움을 게을리해서는 안 된다. 가난해도 부지런히 배우면 몸을 세울 수 있고, 부유한데 부지런히 배우면 이름이 더욱 빛난다. 배운 사람이 출세하는 것은 보았어도 배운 사람이 이루지 못하는 것은 보지 못했다. 배움은 몸의 보배요 세상의 보물이다. 그러므로 배우면 군자가 되고 배우지 않으면 소인이 되니, 뒤에 배우는 사람들은 저마다 힘써야 한다.\""}, {"h": "徽宗皇帝曰 學者는 如禾如稻하고 不學者는 如蒿如草로다 如禾如稻兮여 國之精糧이요 世之大寶로다 如蒿如草兮여 耕者憎嫌하고 鋤者煩惱니라 他日面墻에 悔之已老로다", "r": "휘종황제왈 학자는 여화여도하고 불학자는 여호여초로다 여화여도혜여 국지정량이요 세지대보로다 여호여초혜여 경자증혐하고 서자번뇌니라 타일면장에 회지이로로다", "k": "휘종황제가 말했다. \"배운 사람은 곡식과 벼 같고, 배우지 않은 사람은 쑥이나 잡초 같다. 곡식과 벼 같은 사람은 나라의 좋은 양식이요 세상의 큰 보배이다. 쑥과 잡초 같은 사람은 밭가는 이가 미워하고 김매는 이가 괴로워한다. 훗날 담장을 마주한 듯 앞이 막혀서야 후회하지만 이미 늙었구나.\""}, {"h": "論語에 曰 學如不及이요 惟恐失之니라", "r": "논어에 왈 학여불급이요 유공실지니라", "k": "논어에 이르기를, \"배움은 따라가지 못할 듯이 힘써야 하고, 오직 배운 것을 잃을까 두려워해야 한다.\""}]}, {"t": "훈자편", "h": "訓子篇", "d": "자식을 바르게 가르치라는 가르침", "items": [{"h": "景行錄에 云 賓客不來면 門戶俗하고 詩書無敎면 子孫愚니라", "r": "경행록에 운 빈객불래면 문호속하고 시서무교면 자손우니라", "k": "경행록에 이르기를, \"손님이 찾아오지 않으면 집안이 속되어지고, 시와 글을 가르치지 않으면 자손이 어리석어진다.\""}, {"h": "莊子曰 事雖小나 不作이면 不成이요 子雖賢이나 不敎면 不明이니라", "r": "장자왈 사수소나 부작이면 불성이요 자수현이나 불교면 불명이니라", "k": "장자가 말했다. \"일이 비록 작아도 하지 않으면 이루지 못하고, 자식이 비록 어질어도 가르치지 않으면 사리에 밝지 못하다.\""}, {"h": "漢書에 云 黃金滿籯이 不如敎子一經이요 賜子千金이 不如敎子一藝니라", "r": "한서에 운 황금만영이 불여교자일경이요 사자천금이 불여교자일예니라", "k": "한서에 이르기를, \"황금을 바구니에 가득 물려주는 것이 자식에게 경서 한 권 가르치는 것만 못하고, 자식에게 천금을 주는 것이 기술 한 가지 가르치는 것만 못하다.\""}, {"h": "至樂은 莫如讀書요 至要는 莫如敎子니라", "r": "지락은 막여독서요 지요는 막여교자니라", "k": "가장 큰 즐거움은 책 읽는 것만 한 것이 없고, 가장 중요한 일은 자식 가르치는 것만 한 것이 없다."}, {"h": "呂榮公曰 內無賢父兄하고 外無嚴師友요 而能有成者鮮矣니라", "r": "여영공왈 내무현부형하고 외무엄사우요 이능유성자선의니라", "k": "여영공이 말했다. \"안으로 어진 부모와 형이 없고, 밖으로 엄한 스승과 벗이 없으면서 무엇을 이룬 사람은 드물다.\""}, {"h": "太公曰 男年長大어든 莫習樂酒하고 女年長大어든 莫令遊走니라", "r": "태공왈 남년장대어든 막습락주하고 여년장대어든 막령유주니라", "k": "태공이 말했다. \"아들이 자라면 풍류와 술을 익히지 못하게 하고, 딸이 자라면 함부로 나돌아다니지 못하게 하라.\""}, {"h": "嚴父는 出孝子요 嚴母는 出孝女니라", "r": "엄부는 출효자요 엄모는 출효녀니라", "k": "엄한 아버지는 효자를 길러 내고, 엄한 어머니는 효녀를 길러 낸다."}, {"h": "憐兒어든 多與棒하고 憎兒어든 多與食이니라", "r": "연아어든 다여봉하고 증아어든 다여식이니라", "k": "자식이 사랑스럽거든 매를 많이 들고, 자식이 미우면 먹을 것을 많이 주어라. (사랑할수록 엄하게 가르치라는 뜻)"}, {"h": "人皆愛珠玉이나 我愛子孫賢이니라", "r": "인개애주옥이나 아애자손현이니라", "k": "사람들은 모두 구슬과 옥을 사랑하지만, 나는 자손이 어진 것을 사랑한다."}]}, {"t": "성심편 상", "h": "省心篇 上", "d": "자기 마음을 살피라는 가르침 (상)", "items": [{"h": "景行錄에 云 寶貨는 用之有盡이요 忠孝는 享之無窮이니라", "r": "경행록에 운 보화는 용지유진이요 충효는 향지무궁이니라", "k": "경행록에 이르기를, \"보배와 재물은 쓰면 다함이 있지만, 충성과 효도는 누려도 끝이 없다.\""}, {"h": "家和貧也好어니와 不義富如何오 但存一子孝면 何用子孫多리오", "r": "가화빈야호어니와 불의부여하오 단존일자효면 하용자손다리오", "k": "집안이 화목하면 가난해도 좋지만, 의롭지 못하면 부유한들 무엇하랴. 효도하는 자식 하나만 있으면 자손이 많은들 무엇하랴."}, {"h": "父不憂心因子孝요 夫無煩惱是妻賢이라 言多語失皆因酒요 義斷親疎只爲錢이니라", "r": "부불우심인자효요 부무번뇌시처현이라 언다어실개인주요 의단친소지위전이니라", "k": "아버지가 근심하지 않는 것은 자식이 효도하기 때문이고, 남편이 번뇌하지 않는 것은 아내가 어질기 때문이다. 말이 많아 실수하는 것은 모두 술 때문이고, 의리가 끊어지고 친한 사이가 멀어지는 것은 오직 돈 때문이다."}, {"h": "旣取非常樂이어든 須防不測憂니라", "r": "기취비상락이어든 수방불측우니라", "k": "이미 보통이 아닌 즐거움을 누렸거든, 헤아릴 수 없는 근심을 대비해야 한다."}, {"h": "得寵思辱하고 居安慮危니라", "r": "득총사욕하고 거안려위니라", "k": "사랑을 받을 때 욕됨을 생각하고, 편안할 때 위태로움을 염려하라."}, {"h": "榮輕辱淺하고 利重害深이니라", "r": "영경욕천하고 이중해심이니라", "k": "영화가 가벼우면 욕됨도 얕고, 이익이 무거우면 해로움도 깊다."}, {"h": "甚愛必甚費요 甚譽必甚毁요 甚喜必甚憂요 甚贓必甚亡이니라", "r": "심애필심비요 심예필심훼요 심희필심우요 심장필심망이니라", "k": "너무 아끼면 반드시 크게 쓰게 되고, 너무 칭찬받으면 반드시 크게 헐뜯기며, 너무 기뻐하면 반드시 크게 근심하고, 뇌물을 너무 탐하면 반드시 크게 망한다."}, {"h": "子曰 不觀高崖면 何以知顚墜之患이며 不臨深泉이면 何以知沒溺之患이며 不觀巨海면 何以知風波之患이리오", "r": "자왈 불관고애면 하이지전추지환이며 불림심천이면 하이지몰닉지환이며 불관거해면 하이지풍파지환이리오", "k": "공자께서 말씀하셨다. \"높은 벼랑을 보지 않으면 어찌 굴러떨어지는 걱정을 알며, 깊은 샘에 가 보지 않으면 어찌 빠지는 걱정을 알며, 큰 바다를 보지 않으면 어찌 풍파의 걱정을 알겠는가.\""}, {"h": "欲知未來인댄 先察已然이니라", "r": "욕지미래인댄 선찰이연이니라", "k": "앞일을 알고자 하면 먼저 지나간 일을 살펴보라."}, {"h": "子曰 明鏡은 所以察形이요 往者는 所以知今이니라", "r": "자왈 명경은 소이찰형이요 왕자는 소이지금이니라", "k": "공자께서 말씀하셨다. \"밝은 거울은 모습을 비추어 보는 것이고, 지나간 일은 지금을 아는 바탕이다.\""}, {"h": "過去事는 明如鏡이요 未來事는 暗似漆이니라", "r": "과거사는 명여경이요 미래사는 암사칠이니라", "k": "지나간 일은 거울처럼 밝지만, 다가올 일은 옻칠처럼 어둡다."}, {"h": "景行錄에 云 明朝之事를 薄暮에 不可必이요 薄暮之事를 晡時에 不可必이니라", "r": "경행록에 운 명조지사를 박모에 불가필이요 박모지사를 포시에 불가필이니라", "k": "경행록에 이르기를, \"내일 아침의 일을 오늘 저녁에 장담할 수 없고, 저녁의 일을 오후에 장담할 수 없다.\""}, {"h": "天有不測風雨하고 人有朝夕禍福이니라", "r": "천유불측풍우하고 인유조석화복이니라", "k": "하늘에는 헤아릴 수 없는 비바람이 있고, 사람에게는 아침저녁으로 바뀌는 화와 복이 있다."}, {"h": "未歸三尺土하여는 難保百年身이요 已歸三尺土하여는 難保百年墳이니라", "r": "미귀삼척토하여는 난보백년신이요 이귀삼척토하여는 난보백년분이니라", "k": "아직 무덤에 들어가기 전에는 백 년 동안 몸을 보존하기 어렵고, 이미 무덤에 들어간 뒤에는 백 년 동안 무덤을 보존하기 어렵다."}, {"h": "景行錄에 云 木有所養則根本固而枝葉茂하여 棟樑之材成하고 水有所養則泉源壯而流波長하여 灌漑之利博하고 人有所養則志氣大而識見明하여 忠義之士出하나니 可不養哉아", "r": "경행록에 운 목유소양즉근본고이지엽무하여 동량지재성하고 수유소양즉천원장이유파장하여 관개지리박하고 인유소양즉지기대이식견명하여 충의지사출하나니 가불양재아", "k": "경행록에 이르기를, \"나무를 잘 기르면 뿌리가 튼튼하고 가지와 잎이 무성하여 기둥과 들보가 될 재목이 되고, 물을 잘 기르면 샘의 근원이 풍부하고 물줄기가 길어 논밭에 물 대는 이로움이 넓어진다. 사람을 잘 기르면 뜻과 기개가 크고 식견이 밝아 충성스럽고 의로운 선비가 나오니, 어찌 기르지 않겠는가.\""}, {"h": "自信者는 人亦信之하여 吳越이 皆兄弟요 自疑者는 人亦疑之하여 身外皆敵國이니라", "r": "자신자는 인역신지하여 오월이 개형제요 자의자는 인역의지하여 신외개적국이니라", "k": "자신을 믿는 사람은 남도 그를 믿어서 원수 사이인 오나라와 월나라 사람도 모두 형제가 되고, 자신을 의심하는 사람은 남도 그를 의심하여 자기 몸 밖이 모두 적이 된다."}, {"h": "疑人莫用하고 用人勿疑니라", "r": "의인막용하고 용인물의니라", "k": "의심스러운 사람은 쓰지 말고, 쓴 사람은 의심하지 마라."}, {"h": "諷諫에 云 水底魚天邊雁은 高可射兮低可釣어니와 惟有人心咫尺間에 咫尺人心不可料니라", "r": "풍간에 운 수저어천변안은 고가사혜저가조어니와 유유인심지척간에 지척인심불가료니라", "k": "풍간에 이르기를, \"물 밑의 물고기와 하늘가의 기러기는 높이 있으면 활로 쏘고 낮게 있으면 낚을 수 있지만, 오직 사람의 마음만은 바로 가까이 있어도 그 가까운 마음을 헤아릴 수 없다.\""}, {"h": "畵虎畵皮難畵骨이요 知人知面不知心이니라", "r": "화호화피난화골이요 지인지면부지심이니라", "k": "호랑이를 그릴 때 가죽은 그려도 뼈는 그리기 어렵고, 사람을 알 때 얼굴은 알아도 마음은 알지 못한다."}, {"h": "對面共話하되 心隔千山이니라", "r": "대면공화하되 심격천산이니라", "k": "얼굴을 마주하고 함께 이야기하지만, 마음은 천 개의 산을 사이에 둔 듯 떨어져 있다."}, {"h": "海枯終見底나 人死不知心이니라", "r": "해고종견저나 인사부지심이니라", "k": "바다는 마르면 마침내 바닥을 볼 수 있지만, 사람은 죽어도 그 마음을 알 수 없다."}, {"h": "太公曰 凡人은 不可逆相이요 海水는 不可斗量이니라", "r": "태공왈 범인은 불가역상이요 해수는 불가두량이니라", "k": "태공이 말했다. \"사람은 겉모습만 보고 앞일을 미리 판단할 수 없고, 바닷물은 말(되)로 헤아릴 수 없다.\""}, {"h": "景行錄에 云 結怨於人은 謂之種禍요 捨善不爲는 謂之自賊이니라", "r": "경행록에 운 결원어인은 위지종화요 사선불위는 위지자적이니라", "k": "경행록에 이르기를, \"남과 원한을 맺는 것은 재앙을 심는 것이고, 착한 일을 버리고 하지 않는 것은 스스로를 해치는 것이다.\""}, {"h": "若聽一面說이면 便見相離別이니라", "r": "약청일면설이면 변견상이별이니라", "k": "만약 한쪽 말만 듣는다면 곧 서로 헤어지게 되는 것을 보게 된다."}, {"h": "飽暖에 思淫慾하고 飢寒에 發道心이니라", "r": "포난에 사음욕하고 기한에 발도심이니라", "k": "배부르고 따뜻하면 음탕한 욕심을 생각하고, 굶주리고 추우면 바른 도를 구하는 마음이 생긴다."}, {"h": "疏廣이 曰 賢人多財則損其志하고 愚人多財則益其過니라", "r": "소광이 왈 현인다재즉손기지하고 우인다재즉익기과니라", "k": "소광이 말했다. \"어진 사람이 재물이 많으면 그 뜻을 해치고, 어리석은 사람이 재물이 많으면 그 허물을 더한다.\""}, {"h": "人貧智短하고 福至心靈이니라", "r": "인빈지단하고 복지심령이니라", "k": "사람이 가난하면 지혜가 짧아지고, 복이 오면 마음도 밝아진다."}, {"h": "不經一事면 不長一智니라", "r": "불경일사면 부장일지니라", "k": "한 가지 일을 겪지 않으면 한 가지 지혜도 자라지 않는다."}, {"h": "是非終日有라도 不聽自然無니라", "r": "시비종일유라도 불청자연무니라", "k": "옳으니 그르니 하는 말이 온종일 있어도, 듣지 않으면 저절로 없어진다."}, {"h": "來說是非者는 便是是非人이니라", "r": "내설시비자는 변시시비인이니라", "k": "찾아와서 남의 옳고 그름을 말하는 사람이 바로 시비를 일으키는 사람이다."}, {"h": "擊壤詩에 云 平生에 不作皺眉事면 世上에 應無切齒人이니 大名을 豈有鐫頑石가 路上行人이 口勝碑니라", "r": "격양시에 운 평생에 부작추미사면 세상에 응무절치인이니 대명을 기유전완석가 노상행인이 구승비니라", "k": "격양시에 이르기를, \"평생 남이 눈살 찌푸릴 일을 하지 않으면 세상에 나를 원망해 이를 가는 사람이 없을 것이다. 큰 이름을 어찌 굳은 돌에 새길 필요가 있으랴. 길 가는 사람들의 입이 비석보다 낫다.\""}, {"h": "有麝自然香이어니 何必當風立가", "r": "유사자연향이어니 하필당풍립가", "k": "사향을 지니면 저절로 향기가 나는데, 어찌 굳이 바람 앞에 서서 향기를 퍼뜨리려 하는가."}, {"h": "有福莫享盡하라 福盡身貧窮이요 有勢莫使盡하라 勢盡寃相逢이니라 福兮常自惜하고 勢兮常自恭하라 人生驕與侈는 有始多無終이니라", "r": "유복막향진하라 복진신빈궁이요 유세막사진하라 세진원상봉이니라 복혜상자석하고 세혜상자공하라 인생교여치는 유시다무종이니라", "k": "복이 있어도 다 누리지 마라. 복이 다하면 몸이 가난해진다. 권세가 있어도 다 부리지 마라. 권세가 다하면 원수와 마주친다. 복은 늘 스스로 아끼고, 권세는 늘 스스로 공손히 하라. 사람이 교만하고 사치하면 시작은 있어도 끝이 없는 경우가 많다."}, {"h": "王參政四留銘에 曰 留有餘不盡之巧하여 以還造化하고 留有餘不盡之祿하여 以還朝廷하고 留有餘不盡之財하여 以還百姓하고 留有餘不盡之福하여 以還子孫이니라", "r": "왕참정사류명에 왈 유유여부진지교하여 이환조화하고 유유여부진지록하여 이환조정하고 유유여부진지재하여 이환백성하고 유유여부진지복하여 이환자손이니라", "k": "왕참정의 네 가지 남겨 둠에 이르기를, \"다 쓰지 않은 재주를 남겨 두어 하늘에 돌려주고, 다 쓰지 않은 녹봉을 남겨 두어 나라에 돌려주며, 다 쓰지 않은 재물을 남겨 두어 백성에게 돌려주고, 다 누리지 않은 복을 남겨 두어 자손에게 돌려준다.\""}, {"h": "黃金千兩이 未爲貴요 得人一語가 勝千金이니라", "r": "황금천량이 미위귀요 득인일어가 승천금이니라", "k": "황금 천 냥이 귀한 것이 아니라, 남에게서 얻은 좋은 말 한마디가 천금보다 낫다."}, {"h": "巧者는 拙之奴요 苦者는 樂之母니라", "r": "교자는 졸지노요 고자는 낙지모니라", "k": "재주 있는 사람은 서툰 사람의 종이 되고, 괴로움은 즐거움의 어머니이다."}, {"h": "小船은 難堪重載요 深逕은 不宜獨行이니라", "r": "소선은 난감중재요 심경은 불의독행이니라", "k": "작은 배는 무거운 짐을 감당하기 어렵고, 깊고 외진 길은 혼자 다니면 좋지 않다."}, {"h": "黃金이 未是貴요 安樂이 値錢多니라", "r": "황금이 미시귀요 안락이 치전다니라", "k": "황금이 귀한 것이 아니라, 편안하고 즐거운 것이 더 값지다."}, {"h": "在家에 不會邀賓客이면 出外에 方知少主人이니라", "r": "재가에 불회요빈객이면 출외에 방지소주인이니라", "k": "집에 있을 때 손님을 맞아 대접할 줄 모르면, 밖에 나가서야 나를 맞아 줄 주인이 적음을 알게 된다."}, {"h": "貧居鬧市無相識이요 富住深山有遠親이니라", "r": "빈거요시무상식이요 부주심산유원친이니라", "k": "가난하면 시끌벅적한 시장에 살아도 아는 사람이 없고, 부유하면 깊은 산속에 살아도 먼 친척까지 찾아온다."}, {"h": "人義는 盡從貧處斷이요 世情은 便向有錢家니라", "r": "인의는 진종빈처단이요 세정은 변향유전가니라", "k": "사람의 의리는 모두 가난한 데서 끊어지고, 세상 인심은 곧 돈 있는 집으로 향한다."}, {"h": "寧塞無底缸이언정 難塞鼻下橫이니라", "r": "영색무저항이언정 난색비하횡이니라", "k": "차라리 밑 빠진 항아리는 막을 수 있어도, 코 밑에 가로놓인 입은 막기 어렵다."}, {"h": "人情은 皆爲窘中疎니라", "r": "인정은 개위군중소니라", "k": "사람의 정은 모두 어려움에 처했을 때 멀어진다."}, {"h": "史記에 曰 郊天禮廟는 非酒不享이요 君臣朋友는 非酒不義요 鬪爭相和는 非酒不勸이라 故로 酒有成敗而不可泛飮之니라", "r": "사기에 왈 교천예묘는 비주불향이요 군신붕우는 비주불의요 투쟁상화는 비주불권이라 고로 주유성패이불가범음지니라", "k": "사기에 이르기를, \"하늘과 사당에 제사 지낼 때도 술이 아니면 흠향하지 않고, 임금과 신하, 벗 사이도 술이 아니면 의리가 두텁지 않으며, 다툰 뒤 화해할 때도 술이 아니면 권하지 못한다. 그러므로 술에는 일을 이루기도 하고 망치기도 하는 힘이 있으니 함부로 마셔서는 안 된다.\""}, {"h": "子曰 士志於道而恥惡衣惡食者는 未足與議也니라", "r": "자왈 사지어도이치악의악식자는 미족여의야니라", "k": "공자께서 말씀하셨다. \"선비가 도에 뜻을 두고서도 허름한 옷과 거친 음식을 부끄러워한다면, 함께 도를 의논할 만하지 않다.\""}, {"h": "荀子曰 士有妬友則賢交不親하고 君有妬臣則賢人不至니라", "r": "순자왈 사유투우즉현교불친하고 군유투신즉현인부지니라", "k": "순자가 말했다. \"선비에게 시기하는 친구가 있으면 어진 벗이 가까이하지 않고, 임금에게 시기하는 신하가 있으면 어진 사람이 오지 않는다.\""}, {"h": "天不生無祿之人하고 地不長無名之草니라", "r": "천불생무록지인하고 지부장무명지초니라", "k": "하늘은 먹고살 복이 없는 사람을 내지 않고, 땅은 이름 없는 풀을 기르지 않는다."}, {"h": "大富는 由天하고 小富는 由勤이니라", "r": "대부는 유천하고 소부는 유근이니라", "k": "큰 부자는 하늘에 달려 있고, 작은 부자는 부지런함에 달려 있다."}, {"h": "成家之兒는 惜糞如金하고 敗家之兒는 用金如糞이니라", "r": "성가지아는 석분여금하고 패가지아는 용금여분이니라", "k": "집안을 일으킬 아이는 거름도 금처럼 아끼고, 집안을 망칠 아이는 금도 거름처럼 쓴다."}, {"h": "康節邵先生曰 閑居에 愼勿說無妨하라 纔說無妨便有妨이라 爽口物多能作疾이요 快心事過必有殃이라 與其病後能服藥으론 不若病前能自防이니라", "r": "강절소선생왈 한거에 신물설무방하라 재설무방변유방이라 상구물다능작질이요 쾌심사과필유앙이라 여기병후능복약으론 불약병전능자방이니라", "k": "강절 소선생이 말했다. \"한가하게 지낼 때 '괜찮다'는 말을 삼가라. '괜찮다'고 말하는 순간 곧 탈이 생긴다. 입에 맞는 음식도 많이 먹으면 병이 되고, 마음에 통쾌한 일도 지나치면 반드시 재앙이 있다. 병든 뒤에 약을 먹는 것보다 병들기 전에 스스로 막는 것이 낫다.\""}, {"h": "梓潼帝君垂訓에 曰 妙藥도 難醫寃債病이요 橫財는 不富命窮人이라 生事事生을 君莫怨하고 害人人害를 汝休嗔하라 天地自然皆有報하니 遠在兒孫近在身이니라", "r": "재동제군수훈에 왈 묘약도 난의원채병이요 횡재는 불부명궁인이라 생사사생을 군막원하고 해인인해를 여휴진하라 천지자연개유보하니 원재아손근재신이니라", "k": "재동제군이 가르쳐 이르기를, \"신묘한 약도 원한과 빚으로 생긴 병은 고치기 어렵고, 뜻밖의 재물도 운명이 궁한 사람을 부자로 만들지 못한다. 일을 만들면 일이 생기니 원망하지 말고, 남을 해치면 남도 나를 해치니 성내지 마라. 하늘과 땅은 저절로 모두 갚음이 있으니, 멀게는 자손에게 있고 가깝게는 내 몸에 있다.\""}, {"h": "花落花開開又落하고 錦衣布衣更換着이라 豪家도 未必常富貴요 貧家도 未必長寂寞이라 扶人未必上靑霄요 推人未必塡邱壑이라 勸君凡事를 莫怨天하라 天意於人에 無厚薄이니라", "r": "화락화개개우락하고 금의포의경환착이라 호가도 미필상부귀요 빈가도 미필장적막이라 부인미필상청소요 추인미필전구학이라 권군범사를 막원천하라 천의어인에 무후박이니라", "k": "꽃은 지고 피고, 피었다가 또 진다. 비단옷과 베옷도 번갈아 입게 된다. 부잣집이라고 늘 부귀한 것도 아니고, 가난한 집이라고 늘 쓸쓸한 것도 아니다. 남을 붙들어 준다고 반드시 하늘 높이 오르는 것도 아니고, 남을 밀친다고 반드시 구렁에 빠지는 것도 아니다. 그대에게 권하노니 모든 일에 하늘을 원망하지 마라. 하늘의 뜻은 사람에게 두텁고 얇음이 없다."}, {"h": "堪歎人心毒似蛇로다 誰知天眼轉如車오 去年妄取東隣物이러니 今日還歸北舍家라 無義錢財는 湯潑雪이요 儻來田地는 水推沙라 若將狡譎爲生計면 恰似朝開暮落花니라", "r": "감탄인심독사사로다 수지천안전여차오 거년망취동린물이러니 금일환귀북사가라 무의전재는 탕발설이요 당래전지는 수추사라 약장교휼위생계면 흡사조개모락화니라", "k": "슬프다, 사람의 마음은 뱀처럼 독하구나. 하늘의 눈이 수레바퀴처럼 돌고 있음을 누가 알까. 지난해 동쪽 이웃의 물건을 함부로 빼앗았더니, 오늘은 그것이 다시 북쪽 집으로 돌아갔다. 의롭지 못한 재물은 끓는 물을 끼얹은 눈과 같고, 갑자기 생긴 땅은 물살에 밀려가는 모래와 같다. 간사한 꾀로 살아가려 한다면 아침에 피었다 저녁에 지는 꽃과 같다."}, {"h": "無藥可醫卿相壽요 有錢難買子孫賢이니라", "r": "무약가의경상수요 유전난매자손현이니라", "k": "높은 벼슬아치의 목숨도 고칠 약이 없고, 돈이 있어도 어진 자손은 사기 어렵다."}, {"h": "一日淸閑이면 一日仙이니라", "r": "일일청한이면 일일선이니라", "k": "하루 마음이 맑고 한가하면, 그 하루는 신선이다."}]}, {"t": "성심편 하", "h": "省心篇 下", "d": "자기 마음을 살피라는 가르침 (하)", "items": [{"h": "眞宗皇帝御製에 曰 知危識險이면 終無羅網之門이요 擧善薦賢이면 自有安身之路라 施仁布德은 乃世代之榮昌이요 懷妬報寃은 與子孫之爲患이라 損人利己면 終無顯達雲仍이요 害衆成家면 豈有長久富貴리오 改名異體는 皆因巧語而生이요 禍起傷身은 皆是不仁之召니라", "r": "진종황제어제에 왈 지위식험이면 종무나망지문이요 거선천현이면 자유안신지로라 시인포덕은 내세대지영창이요 회투보원은 여자손지위환이라 손인이기면 종무현달운잉이요 해중성가면 기유장구부귀리오 개명이체는 개인교어이생이요 화기상신은 개시불인지소니라", "k": "진종황제가 지어 이르기를, \"위태로움과 험함을 알면 끝내 법망에 걸리는 일이 없고, 착한 이를 들어 쓰고 어진 이를 추천하면 저절로 몸이 편안한 길이 있다. 어짊과 덕을 베풀면 대대로 번창하고, 시기심을 품고 원한을 갚으려 하면 자손에게 근심을 준다. 남을 해쳐 자기를 이롭게 하면 끝내 출세하는 자손이 없고, 여러 사람을 해쳐 집안을 일으키면 어찌 부귀가 오래가겠는가. 이름이 바뀌고 몸이 상하는 것은 모두 교묘한 말에서 생기고, 재앙이 일어나 몸을 다치는 것은 모두 어질지 못함이 부른 것이다.\""}, {"h": "神宗皇帝御製에 曰 遠非道之財하고 戒過度之酒하며 居必擇隣하고 交必擇友하며 嫉妬를 勿起於心하고 讒言을 勿宣於口하며 骨肉貧者를 莫疎하고 他人富者를 莫厚하며 克己는 以勤儉爲先하고 愛衆은 以謙和爲首하며 常思已往之非하고 每念未來之咎하라 若依朕之斯言이면 治國家而可久니라", "r": "신종황제어제에 왈 원비도지재하고 계과도지주하며 거필택린하고 교필택우하며 질투를 물기어심하고 참언을 물선어구하며 골육빈자를 막소하고 타인부자를 막후하며 극기는 이근검위선하고 애중은 이겸화위수하며 상사이왕지비하고 매념미래지구하라 약의짐지사언이면 치국가이가구니라", "k": "신종황제가 지어 이르기를, \"옳지 않은 재물을 멀리하고, 지나친 술을 경계하며, 살 때는 반드시 이웃을 가리고, 사귈 때는 반드시 벗을 가려라. 시기하는 마음을 일으키지 말고, 남을 헐뜯는 말을 입 밖에 내지 마라. 가난한 친척을 멀리하지 말고, 부유한 남을 두텁게 대하지 마라. 자신을 이기는 데는 부지런함과 검소함을 먼저 하고, 사람들을 사랑하는 데는 겸손과 화목을 으뜸으로 하라. 늘 지난날의 잘못을 생각하고, 늘 앞으로 있을 허물을 염려하라. 나의 이 말을 따르면 나라와 집안을 다스려 오래갈 수 있다.\""}, {"h": "高宗皇帝御製에 曰 一星之火도 能燒萬頃之薪하고 半句非言도 誤損平生之德이라 身被一縷나 常思織女之勞하고 日食三飡이나 每念農夫之苦하라 苟貪妬損이면 終無十載安康이요 積善存仁이면 必有榮華後裔라 福緣善慶은 多因積行而生이요 入聖超凡은 盡是眞實而得이니라", "r": "고종황제어제에 왈 일성지화도 능소만경지신하고 반구비언도 오손평생지덕이라 신피일루나 상사직녀지로하고 일식삼손이나 매념농부지고하라 구탐투손이면 종무십재안강이요 적선존인이면 필유영화후예라 복연선경은 다인적행이생이요 입성초범은 진시진실이득이니라", "k": "고종황제가 지어 이르기를, \"작은 불티 하나가 넓은 들의 땔나무를 태울 수 있고, 반 마디 그릇된 말이 평생의 덕을 잃게 한다. 몸에 실 한 오라기를 걸쳐도 늘 베 짜는 여인의 수고를 생각하고, 하루 세 끼를 먹어도 늘 농부의 고생을 생각하라. 탐내고 시기하여 남을 해치면 끝내 십 년의 평안도 없고, 착한 일을 쌓고 어짊을 지키면 반드시 자손이 영화를 누린다. 복과 경사는 대부분 착한 행실을 쌓는 데서 생기고, 성인의 경지에 들어 범인을 넘어서는 것은 모두 참되고 성실함으로 얻는 것이다.\""}, {"h": "王良曰 欲知其君인대 先視其臣하고 欲識其人인대 先視其友하고 欲知其父인대 先視其子하라 君聖臣忠하고 父慈子孝니라", "r": "왕량왈 욕지기군인대 선시기신하고 욕식기인인대 선시기우하고 욕지기부인대 선시기자하라 군성신충하고 부자자효니라", "k": "왕량이 말했다. \"그 임금을 알려면 먼저 그 신하를 보고, 그 사람을 알려면 먼저 그 벗을 보고, 그 아버지를 알려면 먼저 그 자식을 보라. 임금이 성스러우면 신하가 충성스럽고, 아버지가 자애로우면 자식이 효도한다.\""}, {"h": "家語에 云 水至淸則無魚하고 人至察則無徒니라", "r": "가어에 운 수지청즉무어하고 인지찰즉무도니라", "k": "공자가어에 이르기를, \"물이 너무 맑으면 물고기가 없고, 사람이 너무 따지면 따르는 사람이 없다.\""}, {"h": "許敬宗曰 春雨如膏나 行人은 惡其泥濘하고 秋月揚輝나 盜者는 憎其照鑑이니라", "r": "허경종왈 춘우여고나 행인은 오기니녕하고 추월양휘나 도자는 증기조감이니라", "k": "허경종이 말했다. \"봄비는 기름처럼 귀하지만 길 가는 사람은 길이 질척거린다고 싫어하고, 가을 달은 밝게 빛나지만 도둑은 환히 비춘다고 미워한다.\" (모든 사람을 만족시킬 수는 없다는 뜻)"}, {"h": "景行錄에 曰 大丈夫見善明故로 重名節於泰山하고 用心精故로 輕死生於鴻毛니라", "r": "경행록에 왈 대장부견선명고로 중명절어태산하고 용심정고로 경사생어홍모니라", "k": "경행록에 이르기를, \"대장부는 선을 보는 눈이 밝기 때문에 명예와 절개를 태산보다 무겁게 여기고, 마음 씀이 정밀하기 때문에 죽고 사는 것을 기러기 털보다 가볍게 여긴다.\""}, {"h": "悶人之凶하고 樂人之善하며 濟人之急하고 救人之危니라", "r": "민인지흉하고 낙인지선하며 제인지급하고 구인지위니라", "k": "남의 불행을 안타까워하고, 남의 좋은 일을 기뻐하며, 남의 급한 처지를 돕고, 남의 위태로움을 구하라."}, {"h": "經目之事도 恐未皆眞이어늘 背後之言을 豈足深信이리오", "r": "경목지사도 공미개진이어늘 배후지언을 기족심신이리오", "k": "눈으로 직접 본 일도 다 참된 것이 아닐까 두려운데, 등 뒤에서 하는 말을 어찌 깊이 믿을 수 있겠는가."}, {"h": "不恨自家汲繩短하고 只恨他家苦井深이로다", "r": "불한자가급승단하고 지한타가고정심이로다", "k": "자기 집 두레박줄이 짧은 것은 탓하지 않고, 남의 집 우물이 깊은 것만 탓한다."}, {"h": "贓濫이 滿天下로되 罪拘薄福人이니라", "r": "장람이 만천하로되 죄구박복인이니라", "k": "뇌물과 부정이 온 세상에 가득하지만, 벌을 받는 것은 복 없는 사람뿐이다."}, {"h": "天若改常이면 不風卽雨요 人若改常이면 不病卽死니라", "r": "천약개상이면 불풍즉우요 인약개상이면 불병즉사니라", "k": "하늘이 평소와 달라지면 바람이 불지 않으면 비가 오고, 사람이 평소와 달라지면 병들지 않으면 죽는다."}, {"h": "壯元詩에 云 國正天心順이요 官淸民自安이라 妻賢夫禍少요 子孝父心寬이니라", "r": "장원시에 운 국정천심순이요 관청민자안이라 처현부화소요 자효부심관이니라", "k": "장원시에 이르기를, \"나라가 바르면 하늘의 뜻도 순하고, 관리가 깨끗하면 백성이 저절로 편안하다. 아내가 어질면 남편의 재앙이 적고, 자식이 효도하면 아버지의 마음이 너그럽다.\""}, {"h": "子曰 木從繩則直하고 人受諫則聖이니라", "r": "자왈 목종승즉직하고 인수간즉성이니라", "k": "공자께서 말씀하셨다. \"나무는 먹줄을 따르면 곧아지고, 사람은 충고를 받아들이면 성스러워진다.\""}, {"h": "一派靑山景色幽러니 前人田土後人收라 後人收得莫歡喜하라 更有收人在後頭니라", "r": "일파청산경색유러니 전인전토후인수라 후인수득막환희하라 갱유수인재후두니라", "k": "한 줄기 푸른 산은 경치가 그윽한데, 앞사람의 논밭을 뒷사람이 거두는구나. 뒷사람아 거두었다고 기뻐하지 마라. 다시 거둘 사람이 뒤에 또 있다."}, {"h": "蘇東坡曰 無故而得千金이면 不有大福이라 必有大禍니라", "r": "소동파왈 무고이득천금이면 불유대복이라 필유대화니라", "k": "소동파가 말했다. \"까닭 없이 천금을 얻으면 큰 복이 있는 것이 아니라 반드시 큰 재앙이 있다.\""}, {"h": "康節邵先生曰 有人이 來問卜하되 如何是禍福고 我虧人是禍요 人虧我是福이니라", "r": "강절소선생왈 유인이 내문복하되 여하시화복고 아휴인시화요 인휴아시복이니라", "k": "강절 소선생이 말했다. \"어떤 사람이 와서 점을 치며 묻기를 '무엇이 화이고 무엇이 복입니까?' 하기에 답했다. '내가 남을 손해 보게 하는 것이 화이고, 남이 나를 손해 보게 하는 것이 복이다.'\""}, {"h": "大廈千間이라도 夜臥八尺이요 良田萬頃이라도 日食二升이니라", "r": "대하천간이라도 야와팔척이요 양전만경이라도 일식이승이니라", "k": "큰 집이 천 칸이라도 밤에 눕는 곳은 여덟 자뿐이고, 좋은 밭이 만 이랑이라도 하루에 먹는 것은 두 되뿐이다."}, {"h": "久住令人賤이요 頻來親也疎라 但看三五日에 相見不如初니라", "r": "구주영인천이요 빈래친야소라 단간삼오일에 상견불여초니라", "k": "오래 머물면 사람을 천하게 만들고, 자주 찾아오면 친한 사이도 멀어진다. 사흘이나 닷새만 지나 보라. 서로 보는 것이 처음 같지 않다."}, {"h": "渴時一滴은 如甘露요 醉後添杯는 不如無니라", "r": "갈시일적은 여감로요 취후첨배는 불여무니라", "k": "목마를 때 한 방울 물은 단 이슬 같지만, 취한 뒤에 더 따르는 술잔은 없느니만 못하다."}, {"h": "酒不醉人人自醉요 色不迷人人自迷니라", "r": "주불취인인자취요 색불미인인자미니라", "k": "술이 사람을 취하게 하는 것이 아니라 사람이 스스로 취하고, 여색이 사람을 홀리는 것이 아니라 사람이 스스로 홀린다."}, {"h": "公心을 若比私心이면 何事不辨이며 道念을 若同情念이면 成佛多時니라", "r": "공심을 약비사심이면 하사불변이며 도념을 약동정념이면 성불다시니라", "k": "공적인 일에 쓰는 마음을 사사로운 일에 쓰는 마음만큼만 쓴다면 무슨 일인들 해내지 못하겠으며, 도를 구하는 마음을 정에 끌리는 마음만큼만 가진다면 벌써 부처가 되었을 것이다."}, {"h": "濂溪先生曰 巧者言하고 拙者默하며 巧者勞하고 拙者逸하며 巧者賊하고 拙者德하며 巧者凶하고 拙者吉하나니 嗚呼라 天下拙이면 刑政이 徹하여 上安下順하며 風淸弊絶이니라", "r": "염계선생왈 교자언하고 졸자묵하며 교자로하고 졸자일하며 교자적하고 졸자덕하며 교자흉하고 졸자길하나니 오호라 천하졸이면 형정이 철하여 상안하순하며 풍청폐절이니라", "k": "염계선생(주돈이)이 말했다. \"약삭빠른 사람은 말이 많고 소박한 사람은 말이 없으며, 약삭빠른 사람은 수고롭고 소박한 사람은 편안하며, 약삭빠른 사람은 남을 해치고 소박한 사람은 덕이 있으며, 약삭빠른 사람은 흉하고 소박한 사람은 길하다. 아아, 온 세상이 소박하다면 형벌과 정치가 잘 통하여 위는 편안하고 아래는 순하며, 풍속이 맑아지고 폐단이 끊어질 것이다.\""}, {"h": "易에 曰 德微而位尊하고 智小而謀大면 無禍者鮮矣니라", "r": "역에 왈 덕미이위존하고 지소이모대면 무화자선의니라", "k": "주역에 이르기를, \"덕은 적은데 지위가 높고, 지혜는 작은데 꾀하는 일이 크면 재앙이 없는 사람이 드물다.\""}, {"h": "說苑에 曰 官怠於宦成하고 病加於小愈하고 禍生於懈惰하고 孝衰於妻子니 察此四者하여 愼終如始니라", "r": "설원에 왈 관태어환성하고 병가어소유하고 화생어해타하고 효쇠어처자니 찰차사자하여 신종여시니라", "k": "설원에 이르기를, \"벼슬은 뜻을 이룬 뒤에 게을러지고, 병은 조금 나은 뒤에 더해지며, 재앙은 게으름에서 생기고, 효도는 처자식이 생기면서 약해진다. 이 네 가지를 살펴서 끝을 처음처럼 삼가라.\""}, {"h": "器滿則溢하고 人滿則喪이니라", "r": "기만즉일하고 인만즉상이니라", "k": "그릇이 가득 차면 넘치고, 사람이 가득 차면(교만하면) 잃는다."}, {"h": "尺璧非寶요 寸陰是競이니라", "r": "척벽비보요 촌음시경이니라", "k": "한 자나 되는 큰 구슬이 보배가 아니라, 한 치의 짧은 시간을 아껴야 한다."}, {"h": "羊羹雖美나 衆口難調니라", "r": "양갱수미나 중구난조니라", "k": "양고기 국이 아무리 맛있어도 여러 사람의 입맛을 다 맞추기는 어렵다."}, {"h": "益智書에 云 白玉은 投於泥塗라도 不能汚穢其色이요 君子는 行於濁地라도 不能染亂其心하나니 故로 松柏은 可以耐雪霜이요 明智는 可以涉艱危니라", "r": "익지서에 운 백옥은 투어니도라도 불능오예기색이요 군자는 행어탁지라도 불능염란기심하나니 고로 송백은 가이내설상이요 명지는 가이섭간위니라", "k": "익지서에 이르기를, \"흰 옥은 진흙탕에 던져도 그 빛을 더럽힐 수 없고, 군자는 혼탁한 곳에 있어도 그 마음을 물들일 수 없다. 그러므로 소나무와 잣나무는 눈서리를 견딜 수 있고, 밝은 지혜는 어려움과 위험을 건널 수 있다.\""}, {"h": "入山擒虎는 易어니와 開口告人은 難이니라", "r": "입산금호는 이어니와 개구고인은 난이니라", "k": "산에 들어가 호랑이를 잡기는 쉬워도, 입을 열어 남에게 어려운 부탁을 하기는 어렵다."}, {"h": "遠水는 不救近火요 遠親은 不如近隣이니라", "r": "원수는 불구근화요 원친은 불여근린이니라", "k": "먼 곳의 물은 가까운 불을 끄지 못하고, 먼 곳의 친척은 가까운 이웃만 못하다."}, {"h": "太公曰 日月이 雖明이나 不照覆盆之下하고 刀刃이 雖快나 不斬無罪之人하고 非灾橫禍는 不入愼家之門이니라", "r": "태공왈 일월이 수명이나 부조복분지하하고 도인이 수쾌나 불참무죄지인하고 비재횡화는 불입신가지문이니라", "k": "태공이 말했다. \"해와 달이 아무리 밝아도 엎어 놓은 동이 밑은 비추지 못하고, 칼날이 아무리 날카로워도 죄 없는 사람은 베지 못하며, 뜻밖의 재앙도 조심하는 집 문 안으로는 들어가지 못한다.\""}, {"h": "太公曰 良田萬頃이 不如薄藝隨身이니라", "r": "태공왈 양전만경이 불여박예수신이니라", "k": "태공이 말했다. \"좋은 밭 만 이랑이 몸에 지닌 작은 재주 하나만 못하다.\""}, {"h": "性理書에 云 接物之要는 己所不欲을 勿施於人하고 行有不得이어든 反求諸己니라", "r": "성리서에 운 접물지요는 기소불욕을 물시어인하고 행유부득이어든 반구저기니라", "k": "성리서에 이르기를, \"사람과 일을 대하는 요점은, 내가 원하지 않는 것을 남에게 하지 말고, 일이 뜻대로 되지 않으면 돌이켜 나에게서 원인을 찾는 것이다.\""}, {"h": "酒色財氣四堵墻에 多少賢愚在內廂이라 若有世人跳得出이면 便是神仙不死方이니라", "r": "주색재기사도장에 다소현우재내상이라 약유세인도득출이면 변시신선불사방이니라", "k": "술과 여색과 재물과 혈기, 이 네 가지 담장 안에 수많은 어진 이와 어리석은 이가 갇혀 있다. 만약 세상 사람 중에 이 담을 뛰어넘어 나오는 이가 있다면, 그것이 곧 신선이 되어 죽지 않는 방법이다."}]}, {"t": "입교편", "h": "立敎篇", "d": "가르침을 바로 세우라는 가르침", "items": [{"h": "子曰 立身有義하니 而孝爲本이요 喪祀有禮하니 而哀爲本이요 戰陣有列하니 而勇爲本이요 治政有理하니 而農爲本이요 居國有道하니 而嗣爲本이요 生財有時하니 而力爲本이니라", "r": "자왈 입신유의하니 이효위본이요 상사유례하니 이애위본이요 전진유열하니 이용위본이요 치정유리하니 이농위본이요 거국유도하니 이사위본이요 생재유시하니 이력위본이니라", "k": "공자께서 말씀하셨다. \"몸을 세우는 데는 의리가 있으니 효도가 근본이고, 상례와 제사에는 예법이 있으니 슬퍼함이 근본이며, 싸움터에는 대열이 있으니 용맹이 근본이고, 정치에는 이치가 있으니 농사가 근본이며, 나라를 지키는 데는 도리가 있으니 후계를 잇는 것이 근본이고, 재물을 만드는 데는 때가 있으니 힘써 일하는 것이 근본이다.\""}, {"h": "景行錄에 云 爲政之要는 曰公與淸이요 成家之道는 曰儉與勤이니라", "r": "경행록에 운 위정지요는 왈공여청이요 성가지도는 왈검여근이니라", "k": "경행록에 이르기를, \"정치의 요점은 공평함과 청렴함이고, 집안을 일으키는 길은 검소함과 부지런함이다.\""}, {"h": "讀書는 起家之本이요 循理는 保家之本이요 勤儉은 治家之本이요 和順은 齊家之本이니라", "r": "독서는 기가지본이요 순리는 보가지본이요 근검은 치가지본이요 화순은 제가지본이니라", "k": "글 읽는 것은 집안을 일으키는 근본이고, 이치를 따르는 것은 집안을 지키는 근본이며, 부지런하고 검소한 것은 집안을 다스리는 근본이고, 화목하고 순한 것은 집안을 가지런히 하는 근본이다."}, {"h": "孔子三計圖에 云 一生之計는 在於幼하고 一年之計는 在於春하고 一日之計는 在於寅이니 幼而不學이면 老無所知요 春若不耕이면 秋無所望이요 寅若不起면 日無所辦이니라", "r": "공자삼계도에 운 일생지계는 재어유하고 일년지계는 재어춘하고 일일지계는 재어인이니 유이불학이면 노무소지요 춘약불경이면 추무소망이요 인약불기면 일무소판이니라", "k": "공자삼계도에 이르기를, \"평생의 계획은 어릴 때 있고, 한 해의 계획은 봄에 있으며, 하루의 계획은 새벽에 있다. 어려서 배우지 않으면 늙어서 아는 것이 없고, 봄에 밭을 갈지 않으면 가을에 바랄 것이 없으며, 새벽에 일어나지 않으면 그날 해낼 일이 없다.\""}, {"h": "性理書에 云 五敎之目은 父子有親하며 君臣有義하며 夫婦有別하며 長幼有序하며 朋友有信이니라", "r": "성리서에 운 오교지목은 부자유친하며 군신유의하며 부부유별하며 장유유서하며 붕우유신이니라", "k": "성리서에 이르기를, \"다섯 가지 가르침의 조목은 이렇다. 부모와 자식 사이에는 친함이 있어야 하고, 임금과 신하 사이에는 의리가 있어야 하며, 남편과 아내 사이에는 분별이 있어야 하고, 어른과 아이 사이에는 차례가 있어야 하며, 벗 사이에는 믿음이 있어야 한다.\""}, {"h": "三綱은 君爲臣綱이요 父爲子綱이요 夫爲婦綱이니라", "r": "삼강은 군위신강이요 부위자강이요 부위부강이니라", "k": "세 가지 큰 도리(삼강)는, 임금은 신하의 근본이 되고, 아버지는 자식의 근본이 되며, 남편은 아내의 근본이 되는 것이다."}, {"h": "王蠋曰 忠臣은 不事二君이요 烈女는 不更二夫니라", "r": "왕촉왈 충신은 불사이군이요 열녀는 불경이부니라", "k": "왕촉이 말했다. \"충신은 두 임금을 섬기지 않고, 열녀는 두 남편을 섬기지 않는다.\""}, {"h": "忠子曰 治官엔 莫若平이요 臨財엔 莫若廉이니라", "r": "충자왈 치관엔 막약평이요 임재엔 막약렴이니라", "k": "충자가 말했다. \"관청을 다스리는 데는 공평함만 한 것이 없고, 재물을 대하는 데는 청렴함만 한 것이 없다.\""}, {"h": "張思叔座右銘에 曰 凡語를 必忠信하며 凡行을 必篤敬하며 飮食을 必愼節하며 字畫을 必楷正하며 容貌를 必端莊하며 衣冠을 必肅整하며 步履를 必安詳하며 居處를 必正靜하며 作事를 必謀始하며 出言을 必顧行하며 常德을 必固持하며 然諾을 必重應하며 見善如己出하며 見惡如己病하라 凡此十四者는 皆我未深省이라 書此當座右하여 朝夕視爲警하노라", "r": "장사숙좌우명에 왈 범어를 필충신하며 범행을 필독경하며 음식을 필신절하며 자획을 필해정하며 용모를 필단장하며 의관을 필숙정하며 보리를 필안상하며 거처를 필정정하며 작사를 필모시하며 출언을 필고행하며 상덕을 필고지하며 연낙을 필중응하며 견선여기출하며 견악여기병하라 범차십사자는 개아미심성이라 서차당좌우하여 조석시위경하노라", "k": "장사숙의 좌우명에 이르기를, \"말은 반드시 진실하고 미덥게 하고, 행동은 반드시 도탑고 공손하게 하며, 음식은 반드시 삼가고 절제하고, 글씨는 반드시 반듯하게 쓰며, 얼굴은 반드시 단정하게 하고, 옷과 갓은 반드시 바르게 하며, 걸음은 반드시 차분하게 하고, 사는 곳은 반드시 바르고 고요하게 하며, 일을 할 때는 반드시 처음을 잘 계획하고, 말을 할 때는 반드시 행동을 돌아보며, 변하지 않는 덕은 반드시 굳게 지키고, 승낙은 반드시 신중하게 하며, 남의 착한 점을 보면 내가 한 것처럼 기뻐하고, 남의 나쁜 점을 보면 내 병처럼 여겨라. 이 열네 가지는 모두 내가 아직 깊이 살피지 못한 것이니, 이를 써서 자리 오른쪽에 두고 아침저녁으로 보며 경계로 삼는다.\""}, {"h": "范益謙座右銘에 曰 一不言朝廷利害邊報差除요 二不言州縣官員長短得失이요 三不言衆人所作過惡之事요 四不言仕進官職趨時附勢요 五不言財利多少厭貧求富요 六不言淫媟戱慢評論女色이요 七不言求覓人物干索酒食이니라", "r": "범익겸좌우명에 왈 일불언조정이해변보차제요 이불언주현관원장단득실이요 삼불언중인소작과악지사요 사불언사진관직추시부세요 오불언재리다소염빈구부요 육불언음설희만평론여색이요 칠불언구멱인물간색주식이니라", "k": "범익겸의 좌우명에 이르기를, \"첫째, 조정의 이해와 변방 소식, 벼슬 임명에 대해 말하지 않는다. 둘째, 지방 관원들의 잘잘못을 말하지 않는다. 셋째, 여러 사람이 저지른 잘못을 말하지 않는다. 넷째, 벼슬길과 시세를 좇아 권세에 붙는 일을 말하지 않는다. 다섯째, 재물의 많고 적음이나 가난을 싫어하고 부자 되기를 구하는 일을 말하지 않는다. 여섯째, 음탕하고 난잡한 농담이나 여색에 대한 평을 말하지 않는다. 일곱째, 남의 물건을 구하거나 술과 음식을 요구하는 말을 하지 않는다.\""}, {"h": "又人附書信을 不可開坼沈滯요 與人並坐에 不可窺人私書요 凡入人家에 不可看人文字요 凡借人物에 不可損壞不還이요 凡喫飮食에 不可揀擇去取요 與人同處에 不可自擇便利요 凡人富貴를 不可歎羨詆毁니 凡此數事에 有犯之者면 足以見用意之不肖라 於存心修身에 大有所害하니 因書以自警하노라", "r": "우인부서신을 불가개탁침체요 여인병좌에 불가규인사서요 범입인가에 불가간인문자요 범차인물에 불가손괴불환이요 범끽음식에 불가간택거취요 여인동처에 불가자택편리요 범인부귀를 불가탄선저훼니 범차수사에 유범지자면 족이견용의지불초라 어존심수신에 대유소해하니 인서이자경하노라", "k": "(이어서) \"또 남이 전해 달라고 맡긴 편지를 뜯어 보거나 늦게 전해서는 안 되고, 남과 나란히 앉았을 때 남의 사적인 글을 엿보아서는 안 되며, 남의 집에 들어가서 남의 문서를 보아서는 안 되고, 남의 물건을 빌리면 망가뜨리거나 돌려주지 않아서는 안 된다. 음식을 먹을 때 가려 먹어서는 안 되고, 남과 함께 지낼 때 나만 편한 것을 골라서는 안 되며, 남의 부귀를 부러워하거나 헐뜯어서는 안 된다. 이런 일을 범하는 사람은 마음 씀이 못났음을 알 수 있으니, 마음을 지키고 몸을 닦는 데 크게 해롭다. 그래서 이것을 써서 스스로 경계한다.\""}, {"h": "武王이 問太公曰 人居世上에 何得貴賤貧富不等고 願聞說之하여 欲知是矣로이다 太公曰 富貴는 如聖人之德하여 皆由天命이어니와 富者는 用之有節하고 不富者는 家有十盜니이다", "r": "무왕이 문태공왈 인거세상에 하득귀천빈부부등고 원문설지하여 욕지시의로이다 태공왈 부귀는 여성인지덕하여 개유천명이어니와 부자는 용지유절하고 불부자는 가유십도니이다", "k": "무왕이 태공에게 물었다. \"사람이 세상에 살면서 어찌하여 귀하고 천하고 가난하고 부유함이 같지 않습니까? 그 까닭을 듣고 싶습니다.\" 태공이 대답했다. \"큰 부귀는 성인의 덕처럼 모두 하늘의 뜻에 달려 있지만, 부유한 사람은 쓰는 데 절제가 있고, 부유하지 못한 사람은 집안에 열 가지 도둑이 있습니다.\""}, {"h": "武王曰 何謂十盜니잇고 太公曰 時熟不收爲一盜요 收積不了爲二盜요 無事燃燈寢睡爲三盜요 慵懶不耕爲四盜요 不施功力爲五盜요 專行巧害爲六盜요 養女太多爲七盜요 晝眠懶起爲八盜요 貪酒嗜慾爲九盜요 强行嫉妬爲十盜니이다", "r": "무왕왈 하위십도니잇고 태공왈 시숙불수위일도요 수적불료위이도요 무사연등침수위삼도요 용라불경위사도요 불시공력위오도요 전행교해위육도요 양녀태다위칠도요 주면라기위팔도요 탐주기욕위구도요 강행질투위십도니이다", "k": "(이어서) 무왕이 \"열 가지 도둑이란 무엇입니까?\" 하고 묻자 태공이 대답했다. \"곡식이 익었는데 거두지 않는 것이 첫째 도둑이고, 거두어 쌓는 일을 마무리하지 않는 것이 둘째, 일 없이 등불을 켜 놓고 잠자는 것이 셋째, 게을러서 밭을 갈지 않는 것이 넷째, 힘써 일하지 않는 것이 다섯째, 오로지 남을 해치는 꾀만 부리는 것이 여섯째, 딸을 너무 많이 키우는 것(혼수 부담)이 일곱째, 낮잠 자고 늦게 일어나는 것이 여덟째, 술과 욕심을 탐하는 것이 아홉째, 억지로 시기하고 질투하는 것이 열째 도둑입니다.\""}, {"h": "武王曰 家無十盜而不富者는 何如니잇고 太公曰 人家必有三耗니이다 武王曰 何名三耗니잇고 太公曰 倉庫漏濫不蓋하여 鼠雀亂食爲一耗요 收種失時爲二耗요 抛撒米穀穢賤爲三耗니이다", "r": "무왕왈 가무십도이불부자는 하여니잇고 태공왈 인가필유삼모니이다 무왕왈 하명삼모니잇고 태공왈 창고누람불개하여 서작난식위일모요 수종실시위이모요 포살미곡예천위삼모니이다", "k": "(이어서) 무왕이 \"집에 열 가지 도둑이 없는데도 부유하지 못한 것은 어째서입니까?\" 하고 묻자 태공이 \"그 집에는 반드시 세 가지 낭비가 있습니다\" 했다. 무왕이 \"세 가지 낭비란 무엇입니까?\" 하자 태공이 대답했다. \"창고가 새고 넘치는데 덮지 않아 쥐와 참새가 마구 먹는 것이 첫째 낭비이고, 거두고 씨 뿌리는 때를 놓치는 것이 둘째 낭비이며, 곡식을 함부로 흘리고 더럽게 다루는 것이 셋째 낭비입니다.\""}]}, {"t": "치정편", "h": "治政篇", "d": "올바르게 다스리라는 가르침", "items": [{"h": "明道先生曰 一命之士라도 苟存心於愛物이면 於人에 必有所濟니라", "r": "명도선생왈 일명지사라도 구존심어애물이면 어인에 필유소제니라", "k": "명도선생(정호)이 말했다. \"가장 낮은 벼슬아치라도 진실로 만물을 사랑하는 마음을 지니고 있다면, 사람들에게 반드시 도움이 되는 바가 있다.\""}, {"h": "唐太宗御製에 云 上有麾之하고 中有乘之하고 下有附之하여 幣帛衣之요 倉廩食之하니 爾俸爾祿이 民膏民脂니라 下民은 易虐이어니와 上蒼은 難欺니라", "r": "당태종어제에 운 상유휘지하고 중유승지하고 하유부지하여 폐백의지요 창름식지하니 이봉이록이 민고민지니라 하민은 이학이어니와 상창은 난기니라", "k": "당태종이 지어 이르기를, \"위에서는 지휘하는 이가 있고, 가운데서는 그것을 받들어 행하는 이가 있으며, 아래에서는 따르는 백성이 있다. 비단으로 옷을 해 입고 창고의 곡식으로 먹고사니, 너희의 봉급과 녹봉은 백성의 피와 땀이다. 아래 백성은 학대하기 쉬우나 위의 하늘은 속이기 어렵다.\""}, {"h": "童蒙訓에 曰 當官之法이 唯有三事하니 曰淸曰愼曰勤이라 知此三者면 知所以持身矣니라", "r": "동몽훈에 왈 당관지법이 유유삼사하니 왈청왈신왈근이라 지차삼자면 지소이지신의니라", "k": "동몽훈에 이르기를, \"벼슬을 맡은 사람이 지킬 법은 오직 세 가지가 있으니, 청렴함과 신중함과 부지런함이다. 이 세 가지를 알면 몸가짐을 어떻게 해야 할지 안다.\""}, {"h": "當官者는 必以暴怒爲戒하여 事有不可어든 當詳處之면 必無不中이어니와 若先暴怒면 只能自害라 豈能害人이리오", "r": "당관자는 필이폭노위계하여 사유불가어든 당상처지면 필무부중이어니와 약선폭노면 지능자해라 기능해인이리오", "k": "벼슬을 맡은 사람은 반드시 갑자기 화내는 것을 경계해야 한다. 일에 옳지 않은 점이 있으면 자세히 살펴서 처리하면 반드시 들어맞지 않는 것이 없다. 만약 먼저 화부터 낸다면 다만 자신을 해칠 뿐이니, 어찌 남을 해칠 수 있겠는가."}, {"h": "事君을 如事親하며 事官長을 如事兄하며 與同僚를 如家人하며 待群吏를 如奴僕하며 愛百姓을 如妻子하며 處官事를 如家事然後에 能盡吾之心이니 如有毫末不至면 皆吾心에 有所未盡也니라", "r": "사군을 여사친하며 사관장을 여사형하며 여동료를 여가인하며 대군리를 여노복하며 애백성을 여처자하며 처관사를 여가사연후에 능진오지심이니 여유호말부지면 개오심에 유소미진야니라", "k": "임금 섬기기를 부모 섬기듯 하고, 윗사람 섬기기를 형 섬기듯 하며, 동료와 지내기를 한집안 사람처럼 하고, 아랫사람 대하기를 집안 일꾼처럼 돌보며, 백성 사랑하기를 처자식처럼 하고, 나랏일 처리하기를 집안일처럼 한 뒤에야 내 마음을 다했다고 할 수 있다. 털끝만큼이라도 미치지 못한 것이 있다면, 모두 내 마음에 다하지 못한 것이 있기 때문이다."}, {"h": "或이 問 簿는 佐令者也니 簿所欲爲를 令或不從이면 奈何잇고 伊川先生曰 當以誠意動之니라 今令與簿不和는 便是爭私意요 令은 是邑之長이니 若能以事父兄之道로 事之하여 過則歸己하고 善則唯恐不歸於令하여 積此誠意면 豈有不動得人이리오", "r": "혹이 문 부는 좌령자야니 부소욕위를 영혹부종이면 내하잇고 이천선생왈 당이성의동지니라 금령여부불화는 변시쟁사의요 영은 시읍지장이니 약능이사부형지도로 사지하여 과즉귀기하고 선즉유공불귀어령하여 적차성의면 기유부동득인이리오", "k": "어떤 사람이 물었다. \"주부(보좌관)는 현령을 돕는 사람인데, 주부가 하고자 하는 일을 현령이 따르지 않으면 어떻게 합니까?\" 이천선생(정이)이 대답했다. \"마땅히 정성스러운 뜻으로 감동시켜야 한다. 지금 현령과 주부가 화합하지 못하는 것은 사사로운 뜻을 다투기 때문이다. 현령은 고을의 어른이니, 부모와 형을 섬기는 도리로 섬겨서 잘못은 자신에게 돌리고 잘한 일은 현령에게 돌아가지 않을까 걱정하며 이런 정성을 쌓는다면, 어찌 사람을 움직이지 못하겠는가.\""}, {"h": "劉安禮問臨民한대 明道先生曰 使民으로 各得輸其情이니라 問御吏한대 曰 正己以格物이니라", "r": "유안례문임민한대 명도선생왈 사민으로 각득수기정이니라 문어리한대 왈 정기이격물이니라", "k": "유안례가 백성을 다스리는 법을 묻자 명도선생이 말했다. \"백성들이 저마다 자기 사정을 다 말할 수 있게 하라.\" 아전을 다스리는 법을 묻자 말했다. \"자기를 바르게 하여 남을 바로잡으라.\""}, {"h": "抱朴子曰 迎斧鉞而正諫하며 據鼎鑊而盡言이면 此謂忠臣也니라", "r": "포박자왈 영부월이정간하며 거정확이진언이면 차위충신야니라", "k": "포박자가 말했다. \"도끼로 처형당할 각오로 바르게 간하고, 끓는 가마솥에 들어갈 각오로 할 말을 다한다면, 이를 충신이라 한다.\""}]}, {"t": "치가편", "h": "治家篇", "d": "집안을 잘 다스리라는 가르침", "items": [{"h": "司馬溫公曰 凡諸卑幼는 事無大小히 毋得專行하고 必咨稟於家長이니라", "r": "사마온공왈 범제비유는 사무대소히 무득전행하고 필자품어가장이니라", "k": "사마온공이 말했다. \"모든 아랫사람과 어린 사람은 일의 크고 작음에 관계없이 제멋대로 하지 말고, 반드시 집안 어른께 여쭈어야 한다.\""}, {"h": "待客엔 不得不豊이요 治家엔 不得不儉이니라", "r": "대객엔 부득불풍이요 치가엔 부득불검이니라", "k": "손님을 대접할 때는 넉넉하지 않으면 안 되고, 집안 살림을 할 때는 검소하지 않으면 안 된다."}, {"h": "太公曰 痴人은 畏婦하고 賢女는 敬夫니라", "r": "태공왈 치인은 외부하고 현녀는 경부니라", "k": "태공이 말했다. \"어리석은 사람은 아내를 두려워하고, 어진 여인은 남편을 공경한다.\""}, {"h": "凡使奴僕엔 先念飢寒이니라", "r": "범사노복엔 선념기한이니라", "k": "무릇 일꾼을 부릴 때는 먼저 그들이 굶주리고 추운지를 생각하라."}, {"h": "子孝雙親樂이요 家和萬事成이니라", "r": "자효쌍친락이요 가화만사성이니라", "k": "자식이 효도하면 두 부모님이 즐겁고, 집안이 화목하면 모든 일이 이루어진다."}, {"h": "時時防火發하고 夜夜備賊來니라", "r": "시시방화발하고 야야비적래니라", "k": "때때로 불이 나지 않도록 막고, 밤마다 도둑이 들지 않도록 대비하라."}, {"h": "景行錄에 云 觀朝夕之早晏하여 可以卜人家之興替니라", "r": "경행록에 운 관조석지조안하여 가이복인가지흥체니라", "k": "경행록에 이르기를, \"아침저녁 일어나고 쉬는 때가 이른지 늦은지를 보면, 그 집안이 흥할지 쇠할지 알 수 있다.\""}, {"h": "文仲子曰 婚娶而論財는 夷虜之道也니라", "r": "문중자왈 혼취이론재는 이로지도야니라", "k": "문중자가 말했다. \"혼인하면서 재물을 따지는 것은 오랑캐의 풍습이다.\""}]}, {"t": "안의편", "h": "安義篇", "d": "가족 간의 의리를 편안히 하라는 가르침", "items": [{"h": "顔氏家訓에 曰 夫有人民而後에 有夫婦하고 有夫婦而後에 有父子하고 有父子而後에 有兄弟하니 一家之親은 此三者而已矣라 自玆以往으로 至于九族히 皆本於三親焉이라 故로 於人倫에 爲重也니 不可不篤이니라", "r": "안씨가훈에 왈 부유인민이후에 유부부하고 유부부이후에 유부자하고 유부자이후에 유형제하니 일가지친은 차삼자이이의라 자자이왕으로 지우구족히 개본어삼친언이라 고로 어인륜에 위중야니 불가부독이니라", "k": "안씨가훈에 이르기를, \"사람이 있은 뒤에 부부가 있고, 부부가 있은 뒤에 부모와 자식이 있으며, 부모와 자식이 있은 뒤에 형제가 있다. 한 집안의 가까운 관계는 이 셋뿐이다. 이로부터 구족(온 친척)에 이르기까지 모두 이 세 가지 관계에 뿌리를 둔다. 그러므로 사람의 도리에서 가장 중요하니, 두텁게 하지 않을 수 없다.\""}, {"h": "莊子曰 兄弟는 爲手足하고 夫婦는 爲衣服이니 衣服破時엔 更得新이어니와 手足斷處엔 難可續이니라", "r": "장자왈 형제는 위수족하고 부부는 위의복이니 의복파시엔 갱득신이어니와 수족단처엔 난가속이니라", "k": "장자가 말했다. \"형제는 손발과 같고 부부는 옷과 같다. 옷은 해지면 새것으로 바꿀 수 있지만, 손발은 끊어지면 다시 잇기 어렵다.\""}, {"h": "蘇東坡云 富不親兮貧不疎는 此是人間大丈夫요 富則進兮貧則退는 此是人間眞小輩니라", "r": "소동파운 부불친혜빈불소는 차시인간대장부요 부즉진혜빈즉퇴는 차시인간진소배니라", "k": "소동파가 말했다. \"부자라고 가까이하지 않고 가난하다고 멀리하지 않는 사람은 세상의 대장부이고, 부자면 다가가고 가난하면 물러나는 사람은 세상의 참된 소인배이다.\""}]}, {"t": "준례편", "h": "遵禮篇", "d": "예절을 지키라는 가르침", "items": [{"h": "子曰 居家有禮故로 長幼辨하고 閨門有禮故로 三族和하고 朝廷有禮故로 官爵序하고 田獵有禮故로 戎事閑하고 軍旅有禮故로 武功成이니라", "r": "자왈 거가유례고로 장유변하고 규문유례고로 삼족화하고 조정유례고로 관작서하고 전렵유례고로 융사한하고 군려유례고로 무공성이니라", "k": "공자께서 말씀하셨다. \"집안에 예가 있으므로 어른과 아이가 분별되고, 안방에 예가 있으므로 친가·외가·처가가 화목하며, 조정에 예가 있으므로 벼슬의 차례가 서고, 사냥에 예가 있으므로 군사 훈련이 익숙해지며, 군대에 예가 있으므로 무공을 이룬다.\""}, {"h": "子曰 君子有勇而無禮면 爲亂하고 小人有勇而無禮면 爲盜니라", "r": "자왈 군자유용이무례면 위란하고 소인유용이무례면 위도니라", "k": "공자께서 말씀하셨다. \"군자가 용맹만 있고 예가 없으면 난리를 일으키고, 소인이 용맹만 있고 예가 없으면 도둑이 된다.\""}, {"h": "曾子曰 朝廷엔 莫如爵이요 鄕黨엔 莫如齒요 輔世長民엔 莫如德이니라", "r": "증자왈 조정엔 막여작이요 향당엔 막여치요 보세장민엔 막여덕이니라", "k": "증자가 말했다. \"조정에서는 벼슬만 한 것이 없고, 마을에서는 나이만 한 것이 없으며, 세상을 돕고 백성을 이끄는 데는 덕만 한 것이 없다.\""}, {"h": "老少長幼는 天分秩序니 不可悖理而傷道也니라", "r": "노소장유는 천분질서니 불가패리이상도야니라", "k": "늙은이와 젊은이, 어른과 아이의 구분은 하늘이 정한 질서이니, 이치를 거슬러 도리를 해쳐서는 안 된다."}, {"h": "出門如見大賓하고 入室如有人이니라", "r": "출문여견대빈하고 입실여유인이니라", "k": "문을 나서면 귀한 손님을 만난 듯 공손히 하고, 방에 들어가면 사람이 있는 듯 몸가짐을 바르게 하라."}, {"h": "若要人重我인댄 無過我重人이니라", "r": "약요인중아인댄 무과아중인이니라", "k": "남이 나를 소중히 여기기를 바란다면, 내가 먼저 남을 소중히 여기는 것보다 나은 방법이 없다."}, {"h": "父不言子之德하며 子不談父之過니라", "r": "부불언자지덕하며 자부담부지과니라", "k": "아버지는 자식의 덕을 자랑하지 않고, 자식은 아버지의 허물을 말하지 않는다."}]}, {"t": "언어편", "h": "言語篇", "d": "말을 삼가라는 가르침", "items": [{"h": "劉會曰 言不中理면 不如不言이니라", "r": "유회왈 언부중리면 불여불언이니라", "k": "유회가 말했다. \"말이 이치에 맞지 않으면 말하지 않는 것만 못하다.\""}, {"h": "一言不中이면 千語無用이니라", "r": "일언부중이면 천어무용이니라", "k": "한마디 말이 맞지 않으면 천 마디 말도 소용이 없다."}, {"h": "君平曰 口舌者는 禍患之門이요 滅身之斧也니라", "r": "군평왈 구설자는 화환지문이요 멸신지부야니라", "k": "군평이 말했다. \"입과 혀는 재앙과 근심이 들어오는 문이요, 몸을 망치는 도끼이다.\""}, {"h": "利人之言은 煖如綿絮하고 傷人之語는 利如荊棘하여 一言半句에 重値千金이요 一語傷人에 痛如刀割이니라", "r": "이인지언은 난여면서하고 상인지어는 이여형극하여 일언반구에 중치천금이요 일어상인에 통여도할이니라", "k": "남을 이롭게 하는 말은 솜처럼 따뜻하고, 남을 상하게 하는 말은 가시처럼 날카롭다. 좋은 말은 한마디 반 구절이라도 천금처럼 귀하고, 남을 상하게 하는 한마디는 칼로 베는 것처럼 아프다."}, {"h": "口是傷人斧요 言是割舌刀니 閉口深藏舌이면 安身處處牢니라", "r": "구시상인부요 언시할설도니 폐구심장설이면 안신처처뢰니라", "k": "입은 사람을 해치는 도끼요, 말은 혀를 베는 칼이다. 입을 닫고 혀를 깊이 감추면 어디에 있든 몸이 편안하고 든든하다."}, {"h": "逢人且說三分話하되 未可全抛一片心이니 不怕虎生三個口요 只恐人情兩樣心이니라", "r": "봉인차설삼분화하되 미가전포일편심이니 불파호생삼개구요 지공인정양양심이니라", "k": "사람을 만나면 할 말의 삼 할만 하고, 내 마음을 한꺼번에 다 털어놓지 마라. 호랑이 입이 셋이라도 두렵지 않지만, 오직 두 가지 마음을 품은 사람의 정이 두렵다."}, {"h": "酒逢知己千鍾少요 話不投機一句多니라", "r": "주봉지기천종소요 화불투기일구다니라", "k": "술은 나를 알아주는 벗을 만나면 천 잔도 적고, 말은 뜻이 맞지 않으면 한마디도 많다."}]}, {"t": "교우편", "h": "交友篇", "d": "벗을 가려 사귀라는 가르침", "items": [{"h": "子曰 與善人居면 如入芝蘭之室하여 久而不聞其香이라도 卽與之化矣요 與不善人居면 如入鮑魚之肆하여 久而不聞其臭라도 亦與之化矣니 丹之所藏者는 赤하고 漆之所藏者는 黑이라 是以로 君子는 必愼其所與處者焉이니라", "r": "자왈 여선인거면 여입지란지실하여 구이불문기향이라도 즉여지화의요 여불선인거면 여입포어지사하여 구이불문기취라도 역여지화의니 단지소장자는 적하고 칠지소장자는 흑이라 시이로 군자는 필신기소여처자언이니라", "k": "공자께서 말씀하셨다. \"착한 사람과 함께 지내면 지초와 난초가 있는 방에 들어간 것 같아서, 오래 지나면 그 향기를 맡지 못해도 곧 향기에 물든다. 착하지 않은 사람과 함께 지내면 절인 생선 가게에 들어간 것 같아서, 오래 지나면 그 냄새를 맡지 못해도 역시 냄새에 물든다. 붉은 물감을 담은 곳은 붉어지고, 옻을 담은 곳은 검어진다. 그러므로 군자는 반드시 함께 지낼 사람을 삼가 가려야 한다.\""}, {"h": "家語에 云 與好人同行이면 如霧露中行하여 雖不濕衣라도 時時有潤하고 與無識人同行이면 如厠中坐하여 雖不汚衣라도 時時聞臭니라", "r": "가어에 운 여호인동행이면 여무로중행하여 수불습의라도 시시유윤하고 여무식인동행이면 여측중좌하여 수불오의라도 시시문취니라", "k": "공자가어에 이르기를, \"좋은 사람과 함께 다니면 안개 속을 걷는 것 같아서 옷이 젖지는 않아도 때때로 촉촉해지고, 무식한 사람과 함께 다니면 뒷간에 앉아 있는 것 같아서 옷이 더러워지지는 않아도 때때로 냄새가 난다.\""}, {"h": "子曰 晏平仲은 善與人交로다 久而敬之온여", "r": "자왈 안평중은 선여인교로다 구이경지온여", "k": "공자께서 말씀하셨다. \"안평중은 사람을 잘 사귀었다. 오래 사귈수록 더욱 공경하는구나.\""}, {"h": "相識이 滿天下하되 知心能幾人고", "r": "상식이 만천하하되 지심능기인고", "k": "서로 아는 사람은 세상에 가득하지만, 마음까지 알아주는 사람은 몇이나 될까."}, {"h": "酒食兄弟는 千個有로되 急難之朋은 一個無니라", "r": "주식형제는 천개유로되 급난지붕은 일개무니라", "k": "술과 밥을 함께할 때의 형제는 천 명이나 있지만, 급하고 어려울 때 도와줄 벗은 한 명도 없다."}, {"h": "不結子花는 休要種이요 無義之朋은 不可交니라", "r": "불결자화는 휴요종이요 무의지붕은 불가교니라", "k": "열매 맺지 않는 꽃은 심지 말고, 의리 없는 벗은 사귀지 마라."}, {"h": "君子之交는 淡如水하고 小人之交는 甘若醴니라", "r": "군자지교는 담여수하고 소인지교는 감약례니라", "k": "군자의 사귐은 물처럼 담담하고, 소인의 사귐은 단술처럼 달콤하다. (담담한 사귐이 오래간다는 뜻)"}, {"h": "路遙知馬力이요 日久見人心이니라", "r": "노요지마력이요 일구견인심이니라", "k": "길이 멀어야 말의 힘을 알고, 날이 오래 지나야 사람의 마음을 알 수 있다."}]}, {"t": "부행편", "h": "婦行篇", "d": "집안 여인의 바른 행실에 대한 가르침", "items": [{"h": "益智書에 云 女有四德之譽하니 一曰婦德이요 二曰婦容이요 三曰婦言이요 四曰婦工也니라", "r": "익지서에 운 여유사덕지예하니 일왈부덕이요 이왈부용이요 삼왈부언이요 사왈부공야니라", "k": "익지서에 이르기를, \"여인에게는 네 가지 덕의 아름다움이 있으니, 첫째는 부덕(마음씨), 둘째는 부용(몸가짐), 셋째는 부언(말씨), 넷째는 부공(솜씨)이다.\""}, {"h": "婦德者는 不必才名絶異요 婦容者는 不必顔色美麗요 婦言者는 不必辯口利詞요 婦工者는 不必技巧過人也니라", "r": "부덕자는 불필재명절이요 부용자는 불필안색미려요 부언자는 불필변구이사요 부공자는 불필기교과인야니라", "k": "(이어서) \"부덕이란 반드시 재주와 이름이 뛰어나야 하는 것이 아니고, 부용이란 반드시 얼굴이 아름다워야 하는 것이 아니며, 부언이란 반드시 말을 잘해야 하는 것이 아니고, 부공이란 반드시 솜씨가 남보다 뛰어나야 하는 것이 아니다.\""}, {"h": "其婦德者는 淸貞廉節하여 守分整齊하고 行止有恥하며 動靜有法이니 此爲婦德也요 婦容者는 洗浣塵垢하여 衣服鮮潔하며 沐浴及時하여 一身無穢니 此爲婦容也요", "r": "기부덕자는 청정렴절하여 수분정제하고 행지유치하며 동정유법이니 차위부덕야요 부용자는 세완진구하여 의복선결하며 목욕급시하여 일신무예니 차위부용야요", "k": "(이어서) \"부덕이란 맑고 곧고 청렴하고 절개가 있어 분수를 지키고 단정하며, 행동에 부끄러움을 알고 움직임에 법도가 있는 것이다. 부용이란 먼지와 때를 씻어 옷을 깨끗하게 하고, 때맞춰 목욕하여 몸에 더러움이 없게 하는 것이다.\""}, {"h": "婦言者는 擇師而說하여 不談非禮하고 時然後言하여 人不厭其言이니 此爲婦言也요 婦工者는 專勤紡績하고 勿好暈酒하며 供具甘旨하여 以奉賓客이니 此爲婦工也니라", "r": "부언자는 택사이설하여 부담비례하고 시연후언하여 인불염기언이니 차위부언야요 부공자는 전근방적하고 물호훈주하며 공구감지하여 이봉빈객이니 차위부공야니라", "k": "(이어서) \"부언이란 가려서 말하여 예의에 어긋난 말을 하지 않고, 때에 맞게 말하여 사람들이 그 말을 싫어하지 않게 하는 것이다. 부공이란 길쌈에 부지런하고 술을 즐기지 않으며, 맛있는 음식을 갖추어 손님을 대접하는 것이다.\""}, {"h": "此四德者는 是婦人之所不可缺者라 爲之甚易하고 務之在正하니 依此而行이면 是爲婦節이니라", "r": "차사덕자는 시부인지소불가결자라 위지심이하고 무지재정하니 의차이행이면 시위부절이니라", "k": "(이어서) \"이 네 가지 덕은 여인에게 없어서는 안 될 것이다. 행하기는 매우 쉽고, 힘쓰는 것은 바르게 하는 데 있으니, 이에 따라 행하면 여인의 바른 도리가 된다.\""}, {"h": "太公曰 婦人之禮는 語必細니라", "r": "태공왈 부인지례는 어필세니라", "k": "태공이 말했다. \"부인의 예절은 말을 반드시 조용하고 부드럽게 하는 것이다.\""}, {"h": "賢婦는 令夫貴요 惡婦는 令夫賤이니라", "r": "현부는 영부귀요 악부는 영부천이니라", "k": "어진 아내는 남편을 귀하게 만들고, 악한 아내는 남편을 천하게 만든다."}, {"h": "家有賢妻면 夫不遭橫禍니라", "r": "가유현처면 부부조횡화니라", "k": "집안에 어진 아내가 있으면 남편이 뜻밖의 재앙을 만나지 않는다."}, {"h": "賢婦는 和六親하고 佞婦는 破六親이니라", "r": "현부는 화육친하고 영부는 파육친이니라", "k": "어진 아내는 온 친척을 화목하게 하고, 간사한 아내는 온 친척의 사이를 깨뜨린다."}]}, {"t": "증보편", "h": "增補篇", "d": "선과 악이 쌓이는 이치 (보충)", "items": [{"h": "周易에 曰 善不積이면 不足以成名이요 惡不積이면 不足以滅身이어늘 小人은 以小善으로 爲无益而弗爲也하고 以小惡으로 爲无傷而弗去也라 故로 惡積而不可掩이요 罪大而不可解니라", "r": "주역에 왈 선부적이면 부족이성명이요 악부적이면 부족이멸신이어늘 소인은 이소선으로 위무익이불위야하고 이소악으로 위무상이불거야라 고로 악적이불가엄이요 죄대이불가해니라", "k": "주역에 이르기를, \"착한 일도 쌓이지 않으면 이름을 이루기에 부족하고, 나쁜 일도 쌓이지 않으면 몸을 망치기에 부족하다. 그런데 소인은 작은 착한 일은 이로울 것이 없다며 하지 않고, 작은 나쁜 일은 해로울 것이 없다며 버리지 않는다. 그래서 악이 쌓여 가릴 수 없게 되고, 죄가 커져 풀 수 없게 된다.\""}, {"h": "履霜하면 堅氷至라 하니 臣弑其君하며 子弑其父 非一朝一夕之事라 其由來者 漸矣니라", "r": "이상하면 견빙지라 하니 신시기군하며 자시기부 비일조일석지사라 기유래자 점의니라", "k": "서리를 밟으면 머지않아 단단한 얼음이 언다고 했다. 신하가 임금을 해치고 자식이 아버지를 해치는 일은 하루아침 하루저녁에 생긴 일이 아니라, 그 원인이 조금씩 쌓여 온 것이다."}]}, {"t": "팔반가", "h": "八反歌", "d": "부모와 자식을 대하는 마음을 돌아보는 여덟 노래", "items": [{"h": "幼兒或詈我하면 我心에 覺歡喜하고 父母嗔怒我하면 我心에 反不甘이라 一歡喜一不甘하니 待兒待父心何懸고 勸君今日逢親怒어든 也應將親作兒看하라", "r": "유아혹리아하면 아심에 각환희하고 부모진노아하면 아심에 반불감이라 일환희일불감하니 대아대부심하현고 권군금일봉친노어든 야응장친작아간하라", "k": "(첫째 노래) 어린 자식이 나를 꾸짖으면 내 마음은 기쁘기만 한데, 부모님이 나에게 화를 내시면 내 마음은 도리어 언짢다. 한쪽은 기쁘고 한쪽은 언짢으니, 자식 대하는 마음과 부모 대하는 마음이 어찌 이리 다른가. 그대에게 권하노니, 오늘 부모님이 화를 내시거든 부모님을 내 아이처럼 여겨 보라."}, {"h": "兒曹出千言하되 君聽常不厭하고 父母一開口하면 便道多閑管이라 非閑管親掛牽이니 皓首白頭에 多諳練이라 勸君敬奉老人言하고 莫敎乳口爭長短하라", "r": "아조출천언하되 군청상불염하고 부모일개구하면 변도다한관이라 비한관친괘견이니 호수백두에 다암련이라 권군경봉노인언하고 막교유구쟁장단하라", "k": "(둘째 노래) 아이들이 천 마디 말을 해도 그대는 늘 싫증 내지 않고 들으면서, 부모님이 한 번 입을 여시면 곧 쓸데없는 참견이 많다고 한다. 참견이 아니라 부모님이 걱정하시는 것이다. 머리가 하얗게 세도록 겪은 일이 많으시다. 그대에게 권하노니, 어르신 말씀을 공경히 받들고, 젖내 나는 입으로 옳고 그름을 다투지 마라."}, {"h": "幼兒尿糞穢는 君心에 無厭忌로되 老親涕唾零에 反有憎嫌意라 六尺軀來何處요 父精母血成汝體라 勸君敬待老來人하라 壯時爲爾筋骨敝니라", "r": "유아요분예는 군심에 무염기로되 노친체타령에 반유증혐의라 육척구래하처요 부정모혈성여체라 권군경대노래인하라 장시위이근골폐니라", "k": "(셋째 노래) 어린아이의 더러운 똥오줌은 그대 마음에 싫지 않으면서, 늙은 부모님이 눈물과 침을 흘리시면 도리어 싫어하는 마음이 든다. 여섯 자 이 몸은 어디서 왔는가. 아버지의 정기와 어머니의 피로 네 몸이 이루어졌다. 그대에게 권하노니, 늙어 가시는 분을 공경히 모셔라. 젊을 때 너를 위해 근육과 뼈가 닳으셨다."}, {"h": "看君晨入市하여 買餠又買糕하니 少聞供父母하고 多說供兒曹라 親未啖兒先飽하니 子心不比親心好라 勸君多出買餠錢하여 供養白頭光陰少하라", "r": "간군신입시하여 매병우매고하니 소문공부모하고 다설공아조라 친미담아선포하니 자심불비친심호라 권군다출매병전하여 공양백두광음소하라", "k": "(넷째 노래) 그대가 새벽에 시장에 가서 떡을 사고 또 과자를 사는 것을 보니, 부모님께 드린다는 말은 적게 들리고 아이들에게 준다는 말만 많다. 부모님은 아직 맛보지도 못했는데 아이들이 먼저 배부르니, 자식의 마음은 부모의 마음만 못하구나. 그대에게 권하노니, 떡 살 돈을 넉넉히 내어 남은 날이 많지 않은 백발의 부모님을 봉양하라."}, {"h": "市間賣藥肆에 惟有肥兒丸하고 未有壯親者하니 何故兩般看고 兒亦病親亦病에 醫兒不比醫親症이라 割股還是親的肉이니 勸君亟保雙親命하라", "r": "시간매약사에 유유비아환하고 미유장친자하니 하고양반간고 아역병친역병에 의아불비의친증이라 할고환시친적육이니 권군극보쌍친명하라", "k": "(다섯째 노래) 시장의 약방에는 아이를 살찌우는 약은 있어도 부모를 튼튼하게 하는 약은 없으니, 어째서 둘을 달리 보는가. 아이도 병들고 부모도 병들었을 때, 아이 병 고치는 것이 부모 병 고치는 것과 비할 바가 아니다. 내 넓적다리 살을 베어도 그것은 본래 부모님의 살이다. 그대에게 권하노니, 서둘러 두 부모님의 목숨을 지켜 드려라."}, {"h": "富貴엔 養親易로되 親常有未安하고 貧賤엔 養兒難이로되 兒不受饑寒이라 一條心兩條路에 爲兒終不如爲父라 勸君養親을 如養兒하고 凡事를 莫推家不富하라", "r": "부귀엔 양친이로되 친상유미안하고 빈천엔 양아난이로되 아불수기한이라 일조심양조로에 위아종불여위부라 권군양친을 여양아하고 범사를 막추가불부하라", "k": "(여섯째 노래) 부유하면 부모님 봉양하기 쉬운데도 부모님은 늘 편치 못하시고, 가난하면 아이 기르기 어려운데도 아이는 굶주리거나 추위에 떨지 않는다. 같은 한마음인데 길이 두 갈래로 나뉘어, 자식을 위하는 마음과 부모를 위하는 마음이 끝내 같지 않구나. 그대에게 권하노니, 부모님 봉양하기를 아이 기르듯 하고, 모든 일을 집이 넉넉하지 않은 탓으로 돌리지 마라."}, {"h": "養親엔 只二人이로되 常與兄弟爭하고 養兒엔 雖十人이나 君皆獨自任이라 兒飽煖親常問하되 父母饑寒不在心이라 勸君養親須竭力하라 當初衣食被君侵이니라", "r": "양친엔 지이인이로되 상여형제쟁하고 양아엔 수십인이나 군개독자임이라 아포난친상문하되 부모기한부재심이라 권군양친수갈력하라 당초의식피군침이니라", "k": "(일곱째 노래) 부모님 봉양은 단 두 분인데도 늘 형제와 다투고, 자식 기르기는 열 명이라도 그대 혼자 다 떠맡는다. 아이가 배부르고 따뜻한지는 늘 묻지만, 부모님이 굶주리고 추운지는 마음에 두지 않는다. 그대에게 권하노니, 부모님 봉양에 힘을 다하라. 처음에 부모님의 옷과 밥은 그대가 다 가져다 썼다."}, {"h": "親有十分慈로되 君不念其恩하고 兒有一分孝로되 君就揚其名이라 待親暗待子明하니 誰識高堂養子心고 勸君漫信兒曹孝하라 兒曹親子在君身이니라", "r": "친유십분자로되 군불념기은하고 아유일분효로되 군취양기명이라 대친암대자명하니 수식고당양자심고 권군만신아조효하라 아조친자재군신이니라", "k": "(여덟째 노래) 부모님은 열 푼의 사랑을 주셨는데도 그대는 그 은혜를 생각하지 않고, 자식이 한 푼의 효도만 해도 그대는 곧 그 이름을 자랑한다. 부모를 대하는 데는 어둡고 자식을 대하는 데는 밝으니, 자식 기르신 부모님의 마음을 누가 알겠는가. 그대에게 권하노니, 아이들의 효도를 함부로 믿지 마라. 아이들이 본받을 부모의 본보기가 바로 그대 몸에 있다."}]}, {"t": "효행편 속", "h": "孝行篇 續", "d": "우리나라 효자 이야기", "items": [{"h": "孫順이 家貧하여 與其妻로 傭作人家以養母할새 有兒每奪母食이라 順이 謂妻曰 兒奪母食하니 兒는 可得이어니와 母難再求라 하고 乃負兒往歸醉山北郊하여 欲埋掘地러니 忽有甚奇石鐘이어늘 驚怪試撞之하니 舂容可愛라", "r": "손순이 가빈하여 여기처로 용작인가이양모할새 유아매탈모식이라 순이 위처왈 아탈모식하니 아는 가득이어니와 모난재구라 하고 내부아왕귀취산북교하여 욕매굴지러니 홀유심기석종이어늘 경괴시당지하니 용용가애라", "k": "신라의 손순은 집이 가난하여 아내와 함께 남의 집 품팔이를 하며 어머니를 모셨다. 그런데 어린 아들이 늘 할머니의 음식을 빼앗아 먹었다. 손순이 아내에게 \"아이는 다시 얻을 수 있지만 어머니는 다시 모실 수 없소\" 하고, 아이를 업고 취산 북쪽 들로 가서 묻으려고 땅을 팠다. 그러자 갑자기 매우 기이한 돌종이 나왔다. 놀라서 시험 삼아 쳐 보니 소리가 은은하고 아름다웠다."}, {"h": "妻曰 得此奇物은 殆兒之福이라 埋之不可라 하여 順이 以爲然하여 將兒與鐘還家하여 懸於梁撞之러니 王이 聞鐘聲淸遠異常而覈聞其實하고 曰 昔에 郭巨埋子에 天賜金釜러니 今孫順이 埋兒에 地出石鐘하니 前後符同이라 하고 賜家一區하고 歲給米五十石하니라", "r": "처왈 득차기물은 태아지복이라 매지불가라 하여 순이 이위연하여 장아여종환가하여 현어량당지러니 왕이 문종성청원이상이핵문기실하고 왈 석에 곽거매자에 천사금부러니 금손순이 매아에 지출석종하니 전후부동이라 하고 사가일구하고 세급미오십석하니라", "k": "(이어서) 아내가 \"이런 기이한 물건을 얻은 것은 아마 이 아이의 복인 듯하니 묻어서는 안 됩니다\" 하자, 손순도 옳다고 여겨 아이와 종을 가지고 집으로 돌아와 들보에 매달고 쳤다. 임금이 맑고 멀리 퍼지는 남다른 종소리를 듣고 그 사연을 알아보게 한 뒤 말했다. \"옛날 곽거가 자식을 묻으려 하자 하늘이 금솥을 내렸는데, 이제 손순이 아이를 묻으려 하자 땅에서 돌종이 나왔으니 앞뒤가 꼭 같구나.\" 그리고 집 한 채를 내리고 해마다 쌀 쉰 섬을 주었다."}, {"h": "尙德이 値年荒癘疫하여 父母飢病濱死어늘 尙德이 日夜不解衣하고 盡誠安慰하되 無以爲養則刲髀肉食之하고 母發癰에 吮之卽癒하니라 王이 嘉之하여 賜賚甚厚하고 命旌其門하고 立石紀事하니라", "r": "상덕이 치년황려역하여 부모기병빈사어늘 상덕이 일야불해의하고 진성안위하되 무이위양즉규비육식지하고 모발옹에 연지즉유하니라 왕이 가지하여 사뢰심후하고 명정기문하고 입석기사하니라", "k": "신라의 상덕은 흉년과 돌림병을 만나 부모님이 굶주리고 병들어 거의 돌아가시게 되자, 밤낮으로 옷도 벗지 않고 정성을 다해 보살폈다. 봉양할 것이 없자 자기 넓적다리 살을 베어 드렸고, 어머니에게 종기가 나자 입으로 빨아 낫게 했다. 임금이 이를 칭찬하여 많은 상을 내리고, 그 집에 효자문을 세우고 비석을 세워 그 일을 기록하게 했다."}, {"h": "都氏家貧至孝라 賣炭買肉하여 無闕母饌이러니 一日은 於市에 晩而忙歸러니 鳶忽攫肉이어늘 都悲號至家하니 鳶旣投肉於庭이러라", "r": "도씨가빈지효라 매탄매육하여 무궐모찬이러니 일일은 어시에 만이망귀러니 연홀확육이어늘 도비호지가하니 연기투육어정이러라", "k": "도씨는 집이 가난했으나 지극한 효자였다. 숯을 팔아 고기를 사서 어머니의 반찬을 거르지 않았다. 하루는 시장에서 늦어 서둘러 돌아오는데 솔개가 갑자기 고기를 채 갔다. 도씨가 슬피 울며 집에 이르니, 솔개가 이미 고기를 마당에 던져 놓았다."}, {"h": "一日은 母病하여 索非時之紅柿어늘 都彷徨柿林하여 不覺日昏이러니 有虎屢遮前路하고 以示乘意라 都乘至百餘里山村하여 訪人家投宿이러니 俄而主人이 饋祭飯而有紅柿라", "r": "일일은 모병하여 색비시지홍시어늘 도방황시림하여 불각일혼이러니 유호누차전로하고 이시승의라 도승지백여리산촌하여 방인가투숙이러니 아이주인이 궤제반이유홍시라", "k": "(이어서) 하루는 어머니가 병이 나서 제철이 아닌 홍시를 찾으셨다. 도씨가 감나무 숲을 헤매다 날이 저무는 줄도 몰랐는데, 호랑이가 여러 번 앞길을 막으며 타라는 뜻을 보였다. 도씨가 호랑이를 타고 백여 리 떨어진 산마을에 이르러 어느 집에 묵기를 청했더니, 얼마 뒤 주인이 제사 음식을 내왔는데 그 가운데 홍시가 있었다."}, {"h": "都喜問柿之來歷하고 且述己意한대 答曰 亡父嗜柿故로 每秋擇柿二百個하여 藏諸窟中而至此五月則完者不過七八이라가 今得五十個完者故로 心異之러니 是天感君孝라 하고 遺以二十顆어늘 都謝出門外하니 虎尙俟伏이라 乘至家하니 曉鷄喔喔이러라 後에 母以天命으로 終에 都有血淚하니라", "r": "도희문시지내력하고 차술기의한대 답왈 망부기시고로 매추택시이백개하여 장저굴중이지차오월즉완자불과칠팔이라가 금득오십개완자고로 심이지러니 시천감군효라 하고 유이이십과어늘 도사출문외하니 호상사복이라 승지가하니 효계악악이러라 후에 모이천명으로 종에 도유혈루하니라", "k": "(이어서) 도씨가 기뻐하며 홍시를 어디서 났는지 묻고 자기 사정을 이야기하자 주인이 말했다. \"돌아가신 아버지께서 홍시를 좋아하셔서 해마다 가을이면 감 이백 개를 골라 굴속에 넣어 두는데, 오월이 되면 성한 것이 일곱여덟 개뿐이었소. 그런데 올해는 성한 것이 쉰 개나 되어 이상하게 여겼더니, 하늘이 그대의 효성에 감동한 것이었구려.\" 그러고는 홍시 스무 개를 주었다. 도씨가 고마워하며 문밖에 나오니 호랑이가 아직 엎드려 기다리고 있었다. 호랑이를 타고 집에 오니 새벽닭이 울었다. 뒷날 어머니가 천수를 다하고 돌아가시자 도씨는 피눈물을 흘렸다."}]}, {"t": "염의편", "h": "廉義篇", "d": "청렴하고 의로운 사람들 이야기", "items": [{"h": "印觀이 賣綿於市할새 有署調者以穀買之而還이러니 有鳶이 攫其綿하여 墮印觀家어늘 印觀이 歸于署調曰 鳶墮汝綿於吾家라 故로 還汝하노라", "r": "인관이 매면어시할새 유서조자이곡매지이환이러니 유연이 확기면하여 타인관가어늘 인관이 귀우서조왈 연타여면어오가라 고로 환여하노라", "k": "신라의 인관이 시장에서 솜을 팔았는데, 서조라는 사람이 곡식을 주고 솜을 사 갔다. 그런데 솔개가 그 솜을 채 가서 인관의 집에 떨어뜨렸다. 인관이 솜을 서조에게 돌려주며 말했다. \"솔개가 그대의 솜을 우리 집에 떨어뜨렸으니 돌려주오.\""}, {"h": "署調曰 鳶攫綿與汝는 天也라 吾何爲受리오 印觀曰 然則還汝穀하리라 署調曰 吾與汝者市二日이니 穀已屬汝矣라 二人이 相讓이라가 幷棄於市하니 掌市官이 以聞王하여 幷賜爵하니라", "r": "서조왈 연확면여여는 천야라 오하위수리오 인관왈 연즉환여곡하리라 서조왈 오여여자시이일이니 곡이속여의라 이인이 상양이라가 병기어시하니 장시관이 이문왕하여 병사작하니라", "k": "(이어서) 서조가 말했다. \"솔개가 솜을 채어 그대에게 준 것은 하늘의 뜻이니 내가 어찌 받겠소.\" 인관이 \"그렇다면 그대의 곡식을 돌려주겠소\" 하자, 서조가 \"내가 그대에게 곡식을 준 지 이미 이틀이 지났으니 곡식은 그대의 것이오\" 했다. 두 사람이 서로 사양하다가 솜과 곡식을 모두 시장에 두고 갔다. 시장을 맡은 관리가 이를 임금께 아뢰니, 임금이 두 사람 모두에게 벼슬을 내렸다."}, {"h": "洪公耆燮이 少貧甚無聊러니 一日朝에 婢兒踊躍獻七兩錢曰 此在鼎中하니 米可數石이요 柴可數駄니 天賜天賜니이다 公이 驚曰 是何金고 卽書失金人推去等字하여 付之門楣而待러니", "r": "홍공기섭이 소빈심무료러니 일일조에 비아용약헌칠량전왈 차재정중하니 미가수석이요 시가수태니 천사천사니이다 공이 경왈 시하금고 즉서실금인추거등자하여 부지문미이대러니", "k": "조선의 홍기섭 공은 젊어서 몹시 가난했다. 어느 날 아침 어린 여종이 기뻐 뛰며 돈 일곱 냥을 바치며 말했다. \"이것이 솥 안에 있었습니다. 쌀을 몇 섬 사고 땔나무를 몇 짐 살 수 있으니 하늘이 주신 것입니다!\" 공이 놀라 \"이것이 웬 돈이냐\" 하고, 곧 '돈 잃은 사람은 찾아가시오'라고 써서 대문 위에 붙여 놓고 기다렸다."}, {"h": "俄而姓劉者來問書意어늘 公이 悉言之한대 劉曰 理無失金於人之鼎內하니 果天賜也라 盍取之니잇고 公曰 非吾物에 何오 劉俯伏曰 小的이 昨夜에 爲窃鼎來라가 還憐家勢蕭條而施之러니 今感公之廉介하고 良心自發하여 誓不更盜하고 願欲常侍하오니 勿慮取之하소서", "r": "아이성유자래문서의어늘 공이 실언지한대 유왈 이무실금어인지정내하니 과천사야라 합취지니잇고 공왈 비오물에 하오 유부복왈 소적이 작야에 위절정래라가 환련가세소조이시지러니 금감공지염개하고 양심자발하여 서불갱도하고 원욕상시하오니 물려취지하소서", "k": "(이어서) 얼마 뒤 유씨 성을 가진 사람이 와서 써 붙인 글의 뜻을 묻자, 공이 사실대로 다 말해 주었다. 유씨가 말했다. \"남의 솥 안에 돈을 잃어버릴 리가 없으니 정말 하늘이 주신 것입니다. 어찌 가지지 않으십니까?\" 공이 \"내 물건이 아닌데 어찌 가지겠소\" 하자, 유씨가 엎드려 말했다. \"사실은 제가 어젯밤 솥을 훔치러 왔다가 살림이 너무 쓸쓸한 것이 가여워 도리어 돈을 두고 갔습니다. 이제 공의 청렴함에 감동하여 양심이 절로 일어나니, 다시는 도둑질하지 않고 늘 곁에서 모시기를 원합니다. 걱정 마시고 받으십시오.\""}, {"h": "公이 卽還金曰 汝之爲良則善矣나 金不可取라 하고 終不受하니라 後에 公이 爲判書하고 其子在龍이 爲憲宗國舅하고 劉亦見信하여 身家大昌하니라", "r": "공이 즉환금왈 여지위량즉선의나 금불가취라 하고 종불수하니라 후에 공이 위판서하고 기자재룡이 위헌종국구하고 유역견신하여 신가대창하니라", "k": "(이어서) 공은 곧 돈을 돌려주며 \"네가 착한 사람이 된다니 참 좋구나. 그러나 돈은 받을 수 없다\" 하고 끝내 받지 않았다. 뒤에 공은 판서가 되었고, 그 아들 재룡은 헌종 임금의 장인이 되었으며, 유씨도 신임을 얻어 집안이 크게 번창했다."}, {"h": "高句麗平原王之女幼時에 好啼러니 王이 戱曰 以汝로 將歸愚溫達하리라 及長에 欲下嫁于上部高氏한대 女以王不可食言으로 固辭하고 終爲溫達之妻하니라", "r": "고구려평원왕지녀유시에 호제러니 왕이 희왈 이여로 장귀우온달하리라 급장에 욕하가우상부고씨한대 여이왕불가식언으로 고사하고 종위온달지처하니라", "k": "고구려 평원왕의 딸은 어릴 때 울기를 잘했다. 왕이 농담으로 \"너를 바보 온달에게 시집보내겠다\"고 했다. 딸이 자라자 왕이 상부의 고씨 집안에 시집보내려 했는데, 공주는 임금은 한 번 한 말을 어겨서는 안 된다며 굳이 사양하고, 마침내 온달의 아내가 되었다."}, {"h": "蓋溫達이 家貧하여 行乞養母하니 時人이 目爲愚溫達也러라 一日은 溫達이 自山中으로 負楡皮而來하니 王女訪見曰 吾乃子之匹也라 하고 乃賣首飾而買田宅器物頗富하고 多養馬以資溫達하여 終爲顯榮하니라", "r": "개온달이 가빈하여 행걸양모하니 시인이 목위우온달야러라 일일은 온달이 자산중으로 부유피이래하니 왕녀방견왈 오내자지필야라 하고 내매수식이매전택기물파부하고 다양마이자온달하여 종위현영하니라", "k": "(이어서) 온달은 집이 가난하여 구걸해서 어머니를 봉양했기에 사람들이 그를 바보 온달이라 불렀다. 하루는 온달이 산에서 느릅나무 껍질을 지고 오는데, 공주가 찾아와 \"나는 그대의 짝입니다\" 하고, 머리 장식을 팔아 밭과 집과 살림살이를 사서 꽤 넉넉해졌다. 또 말을 많이 길러 온달을 도우니, 온달은 마침내 이름을 떨치고 영화를 누렸다."}]}, {"t": "권학편", "h": "勸學篇", "d": "배움을 권하는 가르침", "items": [{"h": "朱子曰 勿謂今日不學而有來日하며 勿謂今年不學而有來年하라 日月逝矣라 歲不我延이니 嗚呼老矣라 是誰之愆고", "r": "주자왈 물위금일불학이유내일하며 물위금년불학이유내년하라 일월서의라 세불아연이니 오호노의라 시수지건고", "k": "주자가 말했다. \"오늘 배우지 않고 내일이 있다고 말하지 말며, 올해 배우지 않고 내년이 있다고 말하지 마라. 해와 달은 흘러가고 세월은 나를 기다려 주지 않는다. 아아, 늙어 버렸구나. 이것이 누구의 허물인가.\""}, {"h": "少年易老學難成하니 一寸光陰이라도 不可輕이라 未覺池塘春草夢인데 階前梧葉已秋聲이니라", "r": "소년이로학난성하니 일촌광음이라도 불가경이라 미각지당춘초몽인데 계전오엽이추성이니라", "k": "소년은 늙기 쉽고 배움은 이루기 어려우니, 한 치의 짧은 시간도 가볍게 여기지 마라. 연못가 봄풀의 꿈에서 아직 깨지도 않았는데, 섬돌 앞 오동잎은 벌써 가을 소리를 낸다."}, {"h": "陶淵明詩에 云 盛年은 不重來하고 一日은 難再晨이니 及時當勉勵하라 歲月은 不待人이니라", "r": "도연명시에 운 성년은 부중래하고 일일은 난재신이니 급시당면려하라 세월은 부대인이니라", "k": "도연명의 시에 이르기를, \"젊은 시절은 다시 오지 않고, 하루에 새벽은 두 번 오기 어렵다. 때를 놓치지 말고 힘써 노력하라. 세월은 사람을 기다려 주지 않는다.\""}, {"h": "荀子曰 不積蹞步면 無以至千里요 不積小流면 無以成江河니라", "r": "순자왈 부적규보면 무이지천리요 부적소류면 무이성강하니라", "k": "순자가 말했다. \"반 걸음이라도 쌓지 않으면 천 리에 이를 수 없고, 작은 물줄기가 모이지 않으면 강과 바다를 이룰 수 없다.\""}]}];
// ---------- storage (safe) ----------
const store={get(k,d){try{const v=localStorage.getItem('msbg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('msbg_'+k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(store.get('favs',[]));
let S=Object.assign({fs:1,showH:true,showR:true,study:false},store.get('set',{}));
function saveSet(){store.set('set',S);applySet()}
function applySet(){document.documentElement.style.setProperty('--fs',S.fs);
  const a=document.getElementById('app');
  a.classList.toggle('hide-h',!S.showH);a.classList.toggle('hide-r',!S.showR);a.classList.toggle('study',!!S.study)}
// flat index
const ALL=[];BOOK.forEach((c,ci)=>c.items.forEach((it,ii)=>ALL.push({ci,ii,it})));
const id=(ci,ii)=>ci+'-'+ii;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500)}
function hl(text,q){const s=esc(text);if(!q)return s;const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(qq,'g'),m=>'<mark>'+m+'</mark>')}
function card(ci,ii,opt={}){const it=BOOK[ci].items[ii],k=id(ci,ii),q=opt.q||'';
  return `<div class="card ${opt.cls||''}" id="p${k}">
  ${opt.label?`<div class="lbl"><span>${opt.label}</span><span>${BOOK[ci].t}</span></div>`:''}
  <div class="h">${opt.num?`<span class="num">${ii+1}.</span>`:''}${hl(it.h,q)}</div>
  <div class="r">${hl(it.r,q)}</div>
  <div class="k">${hl(it.k,q)}</div>
  <div class="meta"><a href="#/ch/${ci}/${ii}">${BOOK[ci].t} ${ii+1}번째 구절</a>
  <button class="star ${favs.has(k)?'on':''}" data-fav="${k}" aria-label="즐겨찾기">${favs.has(k)?'★':'☆'}</button></div></div>`}
function dayIndex(){const d=new Date();const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return ((n*7919)%ALL.length+ALL.length)%ALL.length}
// ---------- views ----------
const V={
home(){const t=ALL[dayIndex()];const last=store.get('last',null);
  return `<div class="hero"><span class="seal">소도</span><h2>소도 명심보감</h2><p>明心寶鑑 · 마음을 밝히는 보배로운 거울</p></div>
  ${card(t.ci,t.ii,{cls:'today',label:'오늘의 한 구절'})}
  <div class="quick">
   <button data-go="#/toc"><span class="i">📖</span>목차 보기</button>
   <button data-go="${last?`#/ch/${last[0]}/${last[1]}`:'#/ch/0'}"><span class="i">🔖</span>${last?'읽던 곳 이어보기':'처음부터 읽기'}</button>
   <button data-go="#/search"><span class="i">🔍</span>구절 찾기</button>
   <button id="rnd2"><span class="i">🎲</span>아무 구절 보기</button>
  </div>
  <p class="note" style="text-align:center;margin-top:18px">전체 ${BOOK.length}편 · ${ALL.length}구절</p>`},
toc(){return `<div class="chlist">${BOOK.map((c,i)=>`<button class="chbtn" data-go="#/ch/${i}"><span class="no">${i+1}</span>
  <span class="tt"><b>${c.t}</b><span>${c.h}</span><small>${c.d}</small></span><span class="cnt">${c.items.length}</span></button>`).join('')}</div>`},
ch(ci,ii){const c=BOOK[ci];if(!c)return V.toc();
  return `<div class="chhead"><div class="hz">${c.h}</div><div class="d">${c.d}</div></div>
  ${c.items.map((_,j)=>card(ci,j,{num:true})).join('')}
  <div class="pager"><button data-go="#/ch/${ci-1}" ${ci==0?'disabled':''}>‹ 이전 편</button>
  <button data-go="#/ch/${ci+1}" ${ci==BOOK.length-1?'disabled':''}>다음 편 ›</button></div>`},
search(){return `<div class="search"><input id="q" type="search" placeholder="한글 또는 한자로 찾기 (예: 효도, 忍)" value="${esc(V._q||'')}" autocomplete="off"></div><div id="res"></div>`},
fav(){const list=ALL.filter(x=>favs.has(id(x.ci,x.ii)));
  if(!list.length)return `<div class="empty">아직 즐겨찾기한 구절이 없습니다.<br><br>마음에 드는 구절 아래의 ☆ 표시를 누르면<br>여기에 모아집니다.</div>`;
  return `<p class="note">즐겨찾기 ${list.length}개</p>`+list.map(x=>card(x.ci,x.ii)).join('')},
set(){return `<div class="opts">
  <div class="opt"><div class="t"><b>글씨 크기</b><small>읽기 편한 크기를 고르세요</small></div>
   <div class="seg" id="fsSeg">${[[0.9,'작게'],[1,'보통'],[1.2,'크게'],[1.4,'아주 크게']].map(([v,l])=>`<button data-fs="${v}" class="${S.fs==v?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="opt"><div class="t"><b>한자 원문 보이기</b></div><label class="sw"><input type="checkbox" data-k="showH" ${S.showH?'checked':''}><span></span></label></div>
  <div class="opt"><div class="t"><b>한글 음(읽는 법) 보이기</b></div><label class="sw"><input type="checkbox" data-k="showR" ${S.showR?'checked':''}><span></span></label></div>
  <div class="opt"><div class="t"><b>공부 모드</b><small>해석을 가려 두고, 누르면 보여 줍니다</small></div><label class="sw"><input type="checkbox" data-k="study" ${S.study?'checked':''}><span></span></label></div>
  <div class="card note">이 앱의 한자 원문은 옛 문헌(저작권 없음)을 바탕으로 했고, 한글 해석은 이 앱을 위해 새로 풀어 쓴 것입니다. 우리나라에서 널리 읽힌 초략본 19편(성심편 상·하)과 증보편·팔반가·효행편 속·염의편·권학편까지 모두 25편을 담았습니다.<br><br>인터넷이 없어도 한 번 열어 둔 뒤에는 볼 수 있습니다.</div>
  </div>`}
};
// ---------- router ----------
function route(){const h=location.hash||'#/';const p=h.slice(2).split('/');const app=$('#app');
  let title='소도 명심보감',html='',tab='#/';
  if(p[0]==='toc'){title='목차';html=V.toc();tab='#/toc'}
  else if(p[0]==='ch'){const ci=+p[1]||0;title=BOOK[ci]?BOOK[ci].t:'목차';html=V.ch(ci);tab='#/toc'}
  else if(p[0]==='search'){title='구절 찾기';html=V.search();tab='#/search'}
  else if(p[0]==='fav'){title='즐겨찾기';html=V.fav();tab='#/fav'}
  else if(p[0]==='set'){title='설정';html=V.set();tab='#/set'}
  else html=V.home();
  app.innerHTML=html;$('#ttl').textContent=title;
  $('#back').style.visibility=(p[0]&&p[0]!=='')?'visible':'hidden';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  if(p[0]==='ch'){const ci=+p[1]||0;const ii=p[2]!=null?+p[2]:null;store.set('last',[ci,ii||0]);
    if(ii!=null){const el=document.getElementById('p'+id(ci,ii));if(el){setTimeout(()=>{el.scrollIntoView({block:'center'});el.style.outline='3px solid var(--gold)';setTimeout(()=>el.style.outline='',1800)},30);return}}}
  if(p[0]==='search'){const q=$('#q');q.addEventListener('input',()=>doSearch(q.value));doSearch(q.value);if(!V._q)setTimeout(()=>q.focus(),50)}
  window.scrollTo(0,0)}
function doSearch(q){V._q=q;q=q.trim();const r=$('#res');if(!q){r.innerHTML='<div class="empty">찾고 싶은 낱말을 입력하세요.<br>예: 효도, 인내, 벗, 忍, 孝</div>';return}
  const list=ALL.filter(x=>x.it.h.includes(q)||x.it.r.includes(q)||x.it.k.includes(q)).slice(0,120);
  r.innerHTML=list.length?`<p class="note">${list.length}개 구절을 찾았습니다</p>`+list.map(x=>card(x.ci,x.ii,{q})).join(''):'<div class="empty">찾는 구절이 없습니다.</div>'}
// ---------- events ----------
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!g.disabled){location.hash=g.dataset.go;return}
  const f=e.target.closest('[data-fav]');if(f){const k=f.dataset.fav;if(favs.has(k)){favs.delete(k);toast('즐겨찾기에서 뺐습니다')}else{favs.add(k);toast('즐겨찾기에 담았습니다')}
    store.set('favs',[...favs]);f.classList.toggle('on',favs.has(k));f.textContent=favs.has(k)?'★':'☆';return}
  const k=e.target.closest('.study .k');if(k){k.classList.toggle('show');return}
  const fs=e.target.closest('[data-fs]');if(fs){S.fs=+fs.dataset.fs;saveSet();document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',b===fs));return}
  if(e.target.closest('#rnd,#rnd2')){const x=ALL[Math.floor(Math.random()*ALL.length)];location.hash=`#/ch/${x.ci}/${x.ii}`}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){S[k]=e.target.checked;saveSet()}});
$('#back').onclick=()=>{if(history.length>1)history.back();else location.hash='#/'};
window.addEventListener('hashchange',route);
applySet();route();
if('serviceWorker' in navigator && location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
</html>
